<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Antrian Enterprise</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Urbanist:wght@400;600;800;900&display=swap');
        :root { --p-color: #004A99; --s-color: #F37021; }
        body { font-family: 'Urbanist', sans-serif; transition: all 0.3s ease; }
        .bg-primary { background-color: var(--p-color); }
        .bg-secondary { background-color: var(--s-color); }
        .text-primary { color: var(--p-color); }
        .text-secondary { color: var(--s-color); }
        .border-primary { border-color: var(--p-color); }
        .border-secondary { border-color: var(--s-color); }
        .marquee { white-space: nowrap; animation: scroll 25s linear infinite; }
        @keyframes scroll { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }
        
        /* Area Cetak Thermal */
        @media print {
            body * { visibility: hidden; }
            #print-area, #print-area * { visibility: visible; }
            #print-area { position: absolute; left: 0; top: 0; width: 100%; text-align: center; font-family: 'Courier New', Courier, monospace; color: black; }
        }
    </style>
</head>
<body class="h-screen flex flex-col bg-slate-50 overflow-hidden">

    <nav class="bg-primary text-white p-4 flex justify-between items-center shadow-xl z-50">
        <div class="flex items-center gap-4">
            <img id="nav-logo" src="" class="h-10 brightness-200 object-contain">
            <span id="nav-bank-name" class="font-black text-xl uppercase tracking-tighter">Memuat...</span>
        </div>
        <div id="clock" class="text-xl font-mono bg-black/20 px-4 py-1 rounded font-bold">00:00:00</div>
    </nav>

    <main id="app-container" class="flex-grow overflow-auto relative"></main>

    <div id="print-area" class="hidden flex flex-col items-center py-4 w-[58mm] mx-auto text-black bg-white">
        <div id="p-header" class="text-sm font-bold whitespace-pre-line text-center border-b-2 border-dashed border-black pb-2 mb-2 w-full"></div>
        <div class="text-[10px] mt-2" id="p-service"></div>
        <h1 id="p-ticket" class="text-5xl font-black my-2"></h1>
        <div id="p-date" class="text-[10px] mb-2 border-b-2 border-dashed border-black pb-2 w-full"></div>
        <div id="p-footer" class="text-xs font-bold whitespace-pre-line text-center w-full"></div>
    </div>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbxDAZvMYENw9JWkoMcISQSD0cXZU3VCGaiqBURhIBS6ld8ei58WlyCHDRrh0ZgI0-P-fw/exec'; 
        const params = new URLSearchParams(window.location.search);
        const view = params.get('view') || 'kiosk';
        let config = {};
        let slideIndex = 0;

        async function init() {
            try {
                const res = await fetch(`${API_URL}?action=getConfig`);
                config = await res.json();
                updateBrand();
                renderView();
                setInterval(updateClock, 1000);
            } catch (e) { document.getElementById('app-container').innerHTML = `<h1 class="text-center mt-20 text-red-500 font-bold">Koneksi Server Gagal</h1>`; }
        }

        function updateClock() {
            const el = document.getElementById('clock');
            if(el) el.innerText = new Date().toLocaleTimeString('id-ID');
        }

        function updateBrand() {
            document.documentElement.style.setProperty('--p-color', config.primaryColor);
            document.documentElement.style.setProperty('--s-color', config.secondaryColor);
            document.getElementById('nav-bank-name').innerText = config.bankName;
            document.getElementById('nav-logo').src = config.bankLogo;
        }

        function renderView() {
            const el = document.getElementById('app-container');
            if(view === 'kiosk') renderKiosk(el);
            else if(view === 'display') renderDisplay(el);
            else if(view === 'staff') renderStaff(el);
            else if(view === 'admin') renderAdmin(el);
        }

        // --- 1. KIOSK ---
        function renderKiosk(el) {
            el.innerHTML = `
                <div class="h-full flex flex-col items-center justify-center bg-slate-900 text-white p-10 text-center z-50 absolute inset-0" id="power-screen">
                    <i class="fa-solid fa-power-off text-9xl text-secondary mb-8 animate-pulse cursor-pointer" onclick="startSystem()"></i>
                    <h1 class="text-4xl font-black">SISTEM ANTRIAN SIAP</h1>
                </div>
                <div id="kiosk-ui" class="hidden h-full flex flex-col items-center justify-center p-10 text-center gap-6">
                    <video id="cam" autoplay class="w-64 h-64 rounded-full border-8 border-primary object-cover shadow-2xl bg-slate-200"></video>
                    <h1 class="text-5xl font-black text-slate-800 tracking-tight">PILIH LAYANAN</h1>
                    <select id="spec-service" class="p-3 border rounded-xl w-full max-w-lg text-lg font-bold bg-white text-slate-800 shadow-md">
                        <option>Setoran / Penarikan Tunai</option>
                        <option>Pembukaan Rekening Baru</option>
                        <option>Layanan Kredit / Pinjaman</option>
                    </select>
                    <div class="grid grid-cols-2 gap-8 w-full max-w-5xl">
                        <button onclick="takeTicket('teller')" class="bg-primary p-10 rounded-[3rem] text-white hover:scale-105 transition shadow-2xl flex flex-col items-center">
                            <i class="fa-solid fa-vault text-8xl mb-4"></i><div class="text-4xl font-black">TELLER</div>
                        </button>
                        <button onclick="takeTicket('cs')" class="bg-secondary p-10 rounded-[3rem] text-white hover:scale-105 transition shadow-2xl flex flex-col items-center">
                            <i class="fa-solid fa-user-tie text-8xl mb-4"></i><div class="text-4xl font-black">CUSTOMER SERVICE</div>
                        </button>
                    </div>
                </div>
            `;
        }

        async function startSystem() {
            window.open(window.location.pathname + '?view=display', 'BankingHall', 'width=1280,height=720');
            document.getElementById('power-screen').classList.add('hidden');
            document.getElementById('kiosk-ui').classList.remove('hidden');
            document.getElementById('kiosk-ui').classList.add('flex');
            const stream = await navigator.mediaDevices.getUserMedia({video: true});
            document.getElementById('cam').srcObject = stream;
        }

        async function takeTicket(type) {
            const video = document.getElementById('cam');
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth; canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            const photo = canvas.toDataURL('image/jpeg', 0.5);
            const service = document.getElementById('spec-service').value;

            const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'generate', type, photo, service }) });
            const data = await res.json();
            if(data.success) {
                document.getElementById('p-header').innerText = data.template.header;
                document.getElementById('p-footer').innerText = data.template.footer;
                document.getElementById('p-ticket').innerText = data.ticket;
                document.getElementById('p-service').innerText = "Layanan: " + service;
                document.getElementById('p-date').innerText = new Date().toLocaleString('id-ID');
                
                document.getElementById('print-area').classList.remove('hidden');
                window.print();
                document.getElementById('print-area').classList.add('hidden');
            }
        }

        // --- 2. TAMPILAN BANKING HALL (MULTI TEMPLATE) ---
        function renderDisplay(el) {
            let mediaHtml = "";
            if(config.mediaType === 'youtube') mediaHtml = `<iframe class="w-full h-full" src="https://www.youtube.com/embed/${config.mediaSource}?autoplay=1&mute=1&loop=1&playlist=${config.mediaSource}" frameborder="0"></iframe>`;
            else if(config.mediaType === 'local') mediaHtml = `<video class="w-full h-full object-cover" src="${config.mediaSource}" autoplay loop muted></video>`;
            else if(config.mediaType === 'slideshow') mediaHtml = `<img id="slide-img" class="w-full h-full object-cover transition-opacity duration-1000">`;

            let counterGridHTML = config.counters.map(c => `
                <div class="flex flex-col bg-slate-800 rounded-xl overflow-hidden border border-slate-700 shadow-lg">
                    <div class="bg-primary text-white text-center font-bold py-1 text-sm">${c}</div>
                    <div class="text-center py-2 text-2xl font-black text-secondary" id="grid-${c.replace(/\s+/g, '-')}">-</div>
                </div>
            `).join('');

            if(config.displayTemplate === 'modern-split') {
                el.innerHTML = `
                    <div class="flex-grow flex flex-col bg-black h-full">
                        <div class="flex-grow grid grid-cols-12 h-full">
                            <div class="col-span-8 bg-black flex flex-col relative">
                                ${mediaHtml}
                                <div class="absolute bottom-0 left-0 w-full bg-slate-900/90 p-4"><div class="grid grid-cols-${Math.min(config.counters.length, 6)} gap-4">${counterGridHTML}</div></div>
                            </div>
                            <div class="col-span-4 bg-white flex flex-col p-8 text-center shadow-2xl z-10">
                                <h2 class="text-2xl font-black text-slate-400 mb-8 border-b pb-4">Panggilan Utama</h2>
                                <div class="flex-grow flex flex-col justify-center items-center">
                                    <div class="w-72 h-72 rounded-[40px] bg-slate-100 overflow-hidden border-8 border-primary mb-8"><img src="" id="d-img" class="w-full h-full object-cover hidden"></div>
                                    <div id="d-ticket" class="text-[140px] font-black text-primary leading-none">-</div>
                                    <div id="d-counter" class="text-5xl font-black text-white bg-secondary px-10 py-3 rounded-full mt-6 shadow-xl">LOKET -</div>
                                </div>
                            </div>
                        </div>
                        <div class="h-20 bg-primary flex items-center overflow-hidden border-t-4 border-secondary"><div class="marquee text-3xl text-white font-black uppercase italic">${config.runningText}</div></div>
                    </div>
                `;
            } else {
                // Template Elegant Dark
                el.innerHTML = `
                    <div class="flex-grow flex flex-col bg-slate-900 text-white h-full relative p-10 gap-8">
                        <div class="absolute inset-0 opacity-20">${mediaHtml}</div>
                        <div class="relative z-10 grid grid-cols-12 gap-8 h-full">
                            <div class="col-span-5 bg-slate-800/80 backdrop-blur-md rounded-[3rem] p-10 flex flex-col justify-center items-center text-center shadow-2xl border border-slate-700">
                                <h2 class="text-3xl font-bold text-slate-400 mb-4">Menuju</h2>
                                <div id="d-counter" class="text-6xl font-black text-secondary mb-8">LOKET -</div>
                                <div id="d-ticket" class="text-[160px] font-black text-white leading-none drop-shadow-2xl">-</div>
                            </div>
                            <div class="col-span-7 grid grid-cols-3 gap-6 align-start content-start relative z-10">${counterGridHTML}</div>
                        </div>
                    </div>
                    <div class="h-20 bg-black flex items-center overflow-hidden"><div class="marquee text-3xl text-secondary font-black uppercase italic">${config.runningText}</div></div>
                `;
            }

            if(config.mediaType === 'slideshow') setInterval(playSlideshow, 5000);
            setInterval(pollDisplay, 2500);
        }

        function playSlideshow() {
            const urls = config.mediaSource.split(',').map(s => s.trim());
            const el = document.getElementById('slide-img');
            if(el && urls.length > 0) {
                el.style.opacity = 0;
                setTimeout(() => { el.src = urls[slideIndex]; el.style.opacity = 1; slideIndex = (slideIndex + 1) % urls.length; }, 500);
            }
        }

        let lastT = "";
        async function pollDisplay() {
            const res = await fetch(`${API_URL}?action=getState`);
            const state = await res.json();
            
            if(state.activeCounters) config.counters.forEach(c => {
                const el = document.getElementById(`grid-${c.replace(/\s+/g, '-')}`);
                if(el) el.innerText = state.activeCounters[c] || "-";
            });

            const now = state.lastCalled;
            if(now.ticket !== lastT && now.ticket !== "-") {
                document.getElementById('d-ticket').innerText = now.ticket;
                document.getElementById('d-counter').innerText = now.counter;
                const imgEl = document.getElementById('d-img');
                if(imgEl && now.photo) { imgEl.src = now.photo; imgEl.classList.remove('hidden'); }
                speak(now.ticket, now.counter);
                lastT = now.ticket;
            }
        }

        function speak(t, c) {
            const msg = new SpeechSynthesisUtterance(`Nomor antrian, ${t.replace('-', ' ')}, silahkan menuju ke ${c}`);
            msg.lang = 'id-ID'; speechSynthesis.speak(msg);
        }

        // --- 3. STAFF COUNTER (DENGAN PREVIEW ANTRIAN) ---
        function renderStaff(el) {
            const role = params.get('role') || 'teller';
            const counterName = params.get('name') || `${role.toUpperCase()} 1`;
            
            el.innerHTML = `
                <div class="h-full flex flex-col p-8 bg-slate-100 gap-6">
                    <!-- Top Info Status -->
                    <div class="bg-white rounded-3xl p-6 shadow-md flex justify-between items-center border-l-8 border-primary">
                        <span class="font-black text-3xl text-slate-800 uppercase tracking-widest">${counterName}</span>
                        <div class="flex gap-8 text-center">
                            <div><div class="text-xs font-bold text-slate-400">SEBELUMNYA</div><div id="st-prev" class="text-2xl font-bold text-slate-600">-</div></div>
                            <div><div class="text-xs font-bold text-secondary">SELANJUTNYA MENUNGGU</div><div id="st-next" class="text-3xl font-black text-secondary animate-pulse">-</div></div>
                        </div>
                    </div>

                    <!-- Main Action Card -->
                    <div class="bg-white p-10 rounded-[3rem] shadow-xl flex-grow flex gap-10 items-center justify-center">
                        <div id="s-photo" class="w-72 h-72 bg-slate-50 rounded-[2rem] border-4 border-dashed flex items-center justify-center overflow-hidden"><i class="fa-solid fa-camera text-6xl text-slate-200"></i></div>
                        <div class="flex flex-col flex-grow max-w-xl">
                            <div class="text-sm font-bold text-slate-400 uppercase mb-2">Nasabah Saat Ini</div>
                            <div id="s-ticket" class="text-[120px] font-black text-primary leading-none mb-4">-</div>
                            <button onclick="staffAction('call', '${role}', '${counterName}')" class="w-full py-6 bg-primary text-white text-3xl font-black rounded-2xl hover:bg-blue-800 shadow-xl active:scale-95 mb-4">PANGGIL BERIKUTNYA <i class="fa-solid fa-bullhorn ml-4"></i></button>
                            <div class="grid grid-cols-2 gap-4">
                                <button onclick="staffAction('recall', '${role}', '${counterName}')" class="py-4 bg-slate-800 text-white font-bold rounded-2xl"><i class="fa-solid fa-rotate-right"></i> PANGGIL ULANG</button>
                                <button onclick="alert('Transaksi selesai')" class="py-4 bg-green-600 text-white font-bold rounded-2xl"><i class="fa-solid fa-check"></i> SELESAI</button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            setInterval(() => pollStaffStatus(role), 3000); // Poll untuk mengintip antrian
        }

        let lastCalled = "";
        async function staffAction(action, type, counterName) {
            const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action, type, counterName, lastTicket: lastCalled }) });
            const data = await res.json();
            if(data.success) {
                lastCalled = data.ticket;
                document.getElementById('s-ticket').innerText = data.ticket;
                if(data.photo) document.getElementById('s-photo').innerHTML = `<img src="${data.photo}" class="w-full h-full object-cover">`;
                pollStaffStatus(type);
            } else { alert(data.msg || "Gagal memanggil"); }
        }

        async function pollStaffStatus(role) {
            const res = await fetch(`${API_URL}?action=getState`);
            const state = await res.json();
            const rData = state[role];
            
            const prev = rData.currentCalled > 1 ? (role==='teller'?'T-':'C-') + (rData.currentCalled - 1) : '-';
            const next = rData.lastGenerated > rData.currentCalled ? (role==='teller'?'T-':'C-') + (rData.currentCalled + 1) : 'KOSONG';
            
            document.getElementById('st-prev').innerText = prev;
            document.getElementById('st-next').innerText = next;
        }

        // --- 4. ADMIN DASHBOARD ---
        function renderAdmin(el) {
            el.innerHTML = `
                <div class="p-8 max-w-7xl mx-auto h-full flex flex-col">
                    <h1 class="text-4xl font-black mb-6 text-primary flex items-center gap-4"><i class="fa-solid fa-sliders"></i> Master Configuration</h1>
                    <div class="grid grid-cols-2 gap-8 overflow-auto max-h-[80vh] pb-20">
                        
                        <!-- Panel Branding -->
                        <div class="bg-white p-8 rounded-3xl shadow-lg border-t-8 border-primary flex flex-col gap-4">
                            <h2 class="font-black text-xl border-b pb-2">BRANDING & MULTIMEDIA</h2>
                            <div>
                                <label class="block text-xs font-bold text-slate-400">URL LOGO BANK</label>
                                <input id="f-logo" class="w-full p-3 border-2 rounded-xl" value="${config.bankLogo}">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-400">TIPE MULTIMEDIA BANKING HALL</label>
                                <select id="f-vtype" class="w-full p-3 border-2 rounded-xl font-bold">
                                    <option value="youtube" ${config.mediaType === 'youtube' ? 'selected' : ''}>YouTube ID</option>
                                    <option value="local" ${config.mediaType === 'local' ? 'selected' : ''}>Video PC Lokal</option>
                                    <option value="slideshow" ${config.mediaType === 'slideshow' ? 'selected' : ''}>Slideshow Gambar</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-400">SUMBER MEDIA (ID Youtube / ./video.mp4 / URL Gambar dipisah koma)</label>
                                <textarea id="f-vsource" class="w-full p-3 border-2 rounded-xl" rows="3">${config.mediaSource}</textarea>
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-400">TEMPLATE BANKING HALL</label>
                                <select id="f-tpl" class="w-full p-3 border-2 rounded-xl font-bold">
                                    <option value="modern-split" ${config.displayTemplate === 'modern-split' ? 'selected' : ''}>Modern Split (Video & Antrian Sebelah)</option>
                                    <option value="elegant-dark" ${config.displayTemplate === 'elegant-dark' ? 'selected' : ''}>Elegant Dark (Fokus Antrian Tengah)</option>
                                </select>
                            </div>
                        </div>

                        <!-- Panel Hardware & Loket -->
                        <div class="bg-white p-8 rounded-3xl shadow-lg border-t-8 border-secondary flex flex-col gap-4">
                            <h2 class="font-black text-xl border-b pb-2">HARDWARE & COUNTER</h2>
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-xs font-bold text-slate-400">MODE PRINTER</label>
                                    <select id="f-pmode" class="w-full p-3 border-2 rounded-xl font-bold">
                                        <option value="kiosk" ${config.printMode === 'kiosk' ? 'selected' : ''}>Kiosk Auto-Print (Butuh --kiosk-printing)</option>
                                        <option value="dialog" ${config.printMode === 'dialog' ? 'selected' : ''}>Standard Dialog</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-slate-400">TARGET PRINTER</label>
                                    <input id="f-ptr" class="w-full p-3 border-2 rounded-xl" value="${config.targetPrinter}" placeholder="Nama Printer di OS">
                                </div>
                            </div>
                            <p class="text-[10px] text-slate-400 italic mb-2">*Info: Agar Print Thermal otomatis, buat shortcut Chrome/Edge dan tambahkan <b>--kiosk-printing</b> pada target properties.</p>
                            
                            <div>
                                <label class="block text-xs font-bold text-slate-400">DAFTAR LOKET AKTIF (Pisahkan dengan koma)</label>
                                <textarea id="f-counters" class="w-full p-3 border-2 rounded-xl font-bold" rows="2">${config.counters.join(', ')}</textarea>
                            </div>
                        </div>

                    </div>
                    
                    <button onclick="saveAdminConfig()" class="fixed bottom-10 right-10 bg-primary text-white px-10 py-4 text-xl font-black rounded-full shadow-2xl hover:scale-105 transition"><i class="fa-solid fa-floppy-disk mr-2"></i> SIMPAN KONFIGURASI</button>
                </div>
            `;
        }

        async function saveAdminConfig() {
            const newConfig = {
                bankName: config.bankName, primaryColor: config.primaryColor, secondaryColor: config.secondaryColor, runningText: config.runningText, receiptTemplate: config.receiptTemplate,
                bankLogo: document.getElementById('f-logo').value,
                mediaType: document.getElementById('f-vtype').value,
                mediaSource: document.getElementById('f-vsource').value,
                displayTemplate: document.getElementById('f-tpl').value,
                printMode: document.getElementById('f-pmode').value,
                targetPrinter: document.getElementById('f-ptr').value,
                counters: document.getElementById('f-counters').value.split(',').map(s => s.trim())
            };
            const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'updateConfig', config: newConfig }) });
            if(res.ok) { alert("Sistem Diperbarui!"); location.reload(); }
        }

        init();
    </script>
</body>
</html>
