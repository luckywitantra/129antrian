<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Antrian Enterprise</title>
    <!-- Tailwind & Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- SweetAlert2 untuk UX Popups -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800;900&display=swap');
        :root { --p-color: #004A99; --s-color: #F37021; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #F8FAFC; -webkit-font-smoothing: antialiased; }
        .bg-primary { background-color: var(--p-color); }
        .bg-secondary { background-color: var(--s-color); }
        .text-primary { color: var(--p-color); }
        .text-secondary { color: var(--s-color); }
        .border-primary { border-color: var(--p-color); }
        .border-secondary { border-color: var(--s-color); }
        
        .marquee { white-space: nowrap; animation: scroll 25s linear infinite; }
        @keyframes scroll { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }
        
        .glass { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.3); }
        .hover-scale { transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
        .hover-scale:hover { transform: scale(1.03); }
        .hover-scale:active { transform: scale(0.97); }

        /* Thermal Print Styles */
        @media print {
            body * { visibility: hidden; }
            #print-area, #print-area * { visibility: visible; }
            #print-area { position: absolute; left: 0; top: 0; width: 100%; text-align: center; font-family: 'Courier New', Courier, monospace; color: black; background: white; margin:0; padding:0; }
        }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: var(--p-color); border-radius: 10px; }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

    <!-- Global Top Navigation -->
    <nav class="bg-primary text-white px-6 py-3 flex justify-between items-center shadow-lg z-50 transition-colors duration-500 relative">
        <div class="flex items-center gap-4">
            <div class="bg-white p-1 rounded-lg shadow-sm"><img id="nav-logo" src="" class="h-10 object-contain"></div>
            <span id="nav-bank-name" class="font-black text-2xl uppercase tracking-tight">Memuat Sistem...</span>
        </div>
        <div class="flex items-center gap-4">
            <span id="role-badge" class="hidden bg-secondary px-4 py-1.5 rounded-full font-bold text-sm tracking-wide shadow-inner"></span>
            <div id="clock" class="text-xl font-mono bg-black/25 px-4 py-1.5 rounded-xl font-bold shadow-inner">00:00:00</div>
        </div>
    </nav>

    <!-- Main Dynamic Container -->
    <main id="app-container" class="flex-grow overflow-auto relative"></main>

    <!-- Hidden Print Area -->
    <div id="print-area" class="hidden flex flex-col items-center py-4 w-[58mm] mx-auto text-black">
        <div id="p-header" class="text-sm font-bold whitespace-pre-line text-center border-b-2 border-dashed border-black pb-2 mb-2 w-full"></div>
        <div class="text-[10px] mt-2 font-bold" id="p-service"></div>
        <h1 id="p-ticket" class="text-5xl font-black my-2"></h1>
        <div id="p-date" class="text-[10px] mb-2 border-b-2 border-dashed border-black pb-2 w-full"></div>
        <div id="p-footer" class="text-xs font-bold whitespace-pre-line text-center w-full"></div>
    </div>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbxDAZvMYENw9JWkoMcISQSD0cXZU3VCGaiqBURhIBS6ld8ei58WlyCHDRrh0ZgI0-P-fw/exec'; 
        const params = new URLSearchParams(window.location.search);
        const view = params.get('view') || 'kiosk';
        let config = {};
        let slideIndex = 0;

        // Custom UI Toast
        const Toast = Swal.mixin({
            toast: true, position: 'top-end', showConfirmButton: false, timer: 3000,
            timerProgressBar: true, didOpen: (toast) => { toast.addEventListener('mouseenter', Swal.stopTimer); toast.addEventListener('mouseleave', Swal.resumeTimer); }
        });

        async function init() {
            try {
                document.getElementById('app-container').innerHTML = `<div class="flex h-full items-center justify-center"><i class="fa-solid fa-circle-notch fa-spin text-6xl text-primary"></i></div>`;
                const res = await fetch(`${API_URL}?action=getConfig`);
                config = await res.json();
                updateBrand();
                renderView();
                setInterval(updateClock, 1000);
            } catch (e) { 
                Swal.fire({ icon: 'error', title: 'Koneksi Terputus', text: 'Gagal terhubung ke server Google Apps Script.' }); 
            }
        }

        function updateClock() { document.getElementById('clock').innerText = new Date().toLocaleTimeString('id-ID'); }

        function updateBrand() {
            document.documentElement.style.setProperty('--p-color', config.primaryColor);
            document.documentElement.style.setProperty('--s-color', config.secondaryColor);
            document.getElementById('nav-bank-name').innerText = config.bankName;
            document.getElementById('nav-logo').src = config.bankLogo;
            
            const badge = document.getElementById('role-badge');
            if(view !== 'display' && view !== 'kiosk') {
                badge.classList.remove('hidden');
                badge.innerText = view === 'staff' ? params.get('name').toUpperCase() : view.toUpperCase();
            }
        }

        function renderView() {
            const el = document.getElementById('app-container');
            if(view === 'kiosk') renderKiosk(el);
            else if(view === 'display') renderDisplay(el);
            else if(view === 'staff') renderStaff(el);
            else if(view === 'admin') renderAdmin(el);
        }

        // ==========================================
        // 1. VIEW: KIOSK (Self-Service Monitor)
        // ==========================================
        function renderKiosk(el) {
            el.innerHTML = `
                <div id="power-screen" class="h-full flex flex-col items-center justify-center bg-slate-900 text-white z-50 absolute inset-0 transition-opacity duration-500">
                    <button onclick="startSystem()" class="hover-scale flex flex-col items-center focus:outline-none">
                        <div class="w-40 h-40 bg-secondary rounded-full flex items-center justify-center mb-8 shadow-[0_0_50px_rgba(243,112,33,0.6)] animate-pulse">
                            <i class="fa-solid fa-power-off text-7xl text-white"></i>
                        </div>
                        <h1 class="text-4xl font-black tracking-widest">TAP UNTUK MEMULAI</h1>
                    </button>
                </div>
                <div id="kiosk-ui" class="hidden h-full flex-col items-center justify-center p-10 gap-8 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] bg-opacity-10 relative">
                    <div class="absolute inset-0 bg-slate-100 opacity-90 z-0"></div>
                    <div class="z-10 flex flex-col items-center w-full max-w-6xl">
                        
                        <div class="relative mb-6">
                            <div class="absolute -inset-2 bg-gradient-to-r from-primary to-secondary rounded-full blur opacity-70 animate-pulse"></div>
                            <video id="cam" autoplay playsinline class="relative w-64 h-64 rounded-full border-8 border-white object-cover shadow-2xl bg-slate-200"></video>
                        </div>
                        
                        <h1 class="text-5xl font-black text-slate-800 tracking-tight mb-2 drop-shadow-sm">PILIH LAYANAN</h1>
                        
                        <div class="glass p-4 rounded-2xl w-full max-w-2xl mb-8 shadow-xl border-t-4 border-primary">
                            <label class="block mb-2 font-bold text-slate-500 text-sm pl-2">DETAIL KEPERLUAN ANDA:</label>
                            <select id="spec-service" class="w-full p-4 rounded-xl text-xl font-bold bg-white text-slate-800 border-2 border-transparent focus:border-primary focus:ring-0 outline-none cursor-pointer shadow-inner">
                                <option>Setoran / Penarikan Tunai</option>
                                <option>Pembukaan Rekening Baru</option>
                                <option>Layanan Kredit / Pinjaman</option>
                                <option>Customer Service Umum</option>
                            </select>
                        </div>

                        <div class="grid grid-cols-2 gap-10 w-full">
                            <button onclick="takeTicket('teller')" class="hover-scale bg-primary p-12 rounded-[2.5rem] text-white shadow-[0_20px_50px_rgba(0,74,153,0.3)] flex flex-col items-center group relative overflow-hidden">
                                <div class="absolute inset-0 bg-white opacity-0 group-hover:opacity-10 transition-opacity"></div>
                                <i class="fa-solid fa-vault text-8xl mb-6 drop-shadow-md"></i>
                                <div class="text-4xl font-black tracking-wide">TELLER</div>
                            </button>
                            <button onclick="takeTicket('cs')" class="hover-scale bg-secondary p-12 rounded-[2.5rem] text-white shadow-[0_20px_50px_rgba(243,112,33,0.3)] flex flex-col items-center group relative overflow-hidden">
                                <div class="absolute inset-0 bg-white opacity-0 group-hover:opacity-10 transition-opacity"></div>
                                <i class="fa-solid fa-user-tie text-8xl mb-6 drop-shadow-md"></i>
                                <div class="text-4xl font-black tracking-wide">CUSTOMER SERVICE</div>
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        async function startSystem() {
            window.open(window.location.pathname + '?view=display', 'BankingHall', 'width=1280,height=720');
            const pScreen = document.getElementById('power-screen');
            pScreen.style.opacity = '0';
            setTimeout(() => {
                pScreen.classList.add('hidden');
                document.getElementById('kiosk-ui').classList.remove('hidden');
                document.getElementById('kiosk-ui').classList.add('flex');
            }, 500);

            try {
                const stream = await navigator.mediaDevices.getUserMedia({video: true});
                document.getElementById('cam').srcObject = stream;
            } catch (err) { Toast.fire({ icon: 'warning', title: 'Kamera tidak terdeteksi.' }); }
        }

        async function takeTicket(type) {
            Swal.fire({ title: 'Mencetak Antrian...', allowOutsideClick: false, didOpen: () => { Swal.showLoading() } });
            
            let photo = "";
            const video = document.getElementById('cam');
            if(video && video.srcObject) {
                const canvas = document.createElement('canvas');
                canvas.width = video.videoWidth; canvas.height = video.videoHeight;
                canvas.getContext('2d').drawImage(video, 0, 0);
                photo = canvas.toDataURL('image/jpeg', 0.5);
            }
            
            const service = document.getElementById('spec-service').value;

            try {
                const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'generate', type, photo, service }) });
                const data = await res.json();
                
                if(data.success) {
                    Swal.fire({ icon: 'success', title: 'Silahkan Ambil Resi Anda', text: `Nomor Antrian: ${data.ticket}`, timer: 3000, showConfirmButton: false });
                    
                    document.getElementById('p-header').innerText = data.template.header;
                    document.getElementById('p-footer').innerText = data.template.footer;
                    document.getElementById('p-ticket').innerText = data.ticket;
                    document.getElementById('p-service').innerText = "Layanan: " + service;
                    document.getElementById('p-date').innerText = new Date().toLocaleString('id-ID');
                    
                    document.getElementById('print-area').classList.remove('hidden');
                    window.print();
                    document.getElementById('print-area').classList.add('hidden');
                }
            } catch (e) {
                Swal.fire({ icon: 'error', title: 'Gagal', text: 'Koneksi ke server bermasalah.' });
            }
        }

        // ==========================================
        // 2. VIEW: DISPLAY (Banking Hall Monitor)
        // ==========================================
        function renderDisplay(el) {
            document.querySelector('nav').style.display = 'none'; // Sembunyikan Nav bar di Display
            
            let mediaHtml = config.mediaType === 'youtube' ? `<iframe class="w-full h-full pointer-events-none" src="https://www.youtube.com/embed/${config.mediaSource}?autoplay=1&mute=1&loop=1&playlist=${config.mediaSource}&controls=0" frameborder="0"></iframe>` :
                            config.mediaType === 'local' ? `<video class="w-full h-full object-cover" src="${config.mediaSource}" autoplay loop muted></video>` :
                            `<img id="slide-img" class="w-full h-full object-cover transition-opacity duration-1000">`;

            let counterGridHTML = config.counters.map(c => `
                <div class="flex flex-col bg-slate-900 rounded-xl overflow-hidden border border-slate-700 shadow-2xl transition-all duration-300" id="box-${c.replace(/\s+/g, '-')}">
                    <div class="bg-primary text-white text-center font-bold py-1.5 text-sm uppercase tracking-wider">${c}</div>
                    <div class="text-center py-3 text-3xl font-black text-secondary" id="grid-${c.replace(/\s+/g, '-')}">-</div>
                </div>
            `).join('');

            el.innerHTML = `
                <div class="flex-grow flex flex-col bg-black h-screen w-full">
                    
                    <div class="absolute top-4 left-6 z-50 flex items-center gap-4 bg-black/50 p-2 rounded-full backdrop-blur-md border border-white/10">
                        <img src="${config.bankLogo}" class="h-10 brightness-200">
                        <span class="text-white font-black text-xl uppercase pr-4">${config.bankName}</span>
                    </div>

                    <div class="flex-grow grid grid-cols-12 h-full">
                        <div class="col-span-8 bg-black flex flex-col relative overflow-hidden">
                            ${mediaHtml}
                            <div class="absolute bottom-0 left-0 w-full bg-gradient-to-t from-black via-black/80 to-transparent pt-20 pb-6 px-6">
                                <div class="grid grid-cols-${Math.min(config.counters.length, 5)} gap-4">${counterGridHTML}</div>
                            </div>
                        </div>
                        <div class="col-span-4 bg-white flex flex-col p-10 text-center shadow-[-10px_0_30px_rgba(0,0,0,0.5)] z-10 relative">
                            <h2 class="text-2xl font-black text-slate-400 mb-8 border-b-2 border-slate-100 pb-4 uppercase tracking-widest">Panggilan Utama</h2>
                            <div class="flex-grow flex flex-col justify-center items-center">
                                <div class="relative mb-10 group">
                                    <div class="absolute -inset-1 bg-gradient-to-r from-primary to-secondary rounded-[3rem] blur opacity-25"></div>
                                    <div class="relative w-80 h-80 rounded-[3rem] bg-slate-50 overflow-hidden border-8 border-white shadow-xl flex items-center justify-center">
                                        <img src="" id="d-img" class="w-full h-full object-cover hidden">
                                        <i id="d-icon" class="fa-solid fa-volume-high text-9xl text-slate-200 animate-pulse"></i>
                                    </div>
                                </div>
                                <div id="d-ticket" class="text-[160px] font-black text-primary leading-none drop-shadow-sm mb-4 transition-all duration-300">-</div>
                                <div id="d-counter" class="text-5xl font-black text-white bg-secondary px-12 py-4 rounded-full shadow-lg border-4 border-white/20">LOKET -</div>
                            </div>
                        </div>
                    </div>
                    <div class="h-20 bg-primary flex items-center overflow-hidden border-t-4 border-secondary relative">
                        <div class="marquee text-4xl text-white font-black uppercase tracking-widest whitespace-nowrap">${config.runningText}</div>
                    </div>
                </div>
            `;

            if(config.mediaType === 'slideshow') setInterval(playSlideshow, 5000);
            setInterval(pollDisplay, 2500);
        }

        function playSlideshow() {
            const urls = config.mediaSource.split(',').map(s => s.trim());
            const el = document.getElementById('slide-img');
            if(el && urls.length > 0) {
                el.style.opacity = 0;
                setTimeout(() => { el.src = urls[slideIndex]; el.style.opacity = 1; slideIndex = (slideIndex + 1) % urls.length; }, 500);
            }
        }

        let lastT = "";
        async function pollDisplay() {
            const res = await fetch(`${API_URL}?action=getState`);
            const state = await res.json();
            
            if(state.activeCounters) config.counters.forEach(c => {
                const el = document.getElementById(`grid-${c.replace(/\s+/g, '-')}`);
                if(el) el.innerText = state.activeCounters[c] || "-";
            });

            const now = state.lastCalled;
            if(now.ticket !== lastT && now.ticket !== "-") {
                const tktEl = document.getElementById('d-ticket');
                tktEl.innerText = now.ticket;
                
                // Animasi Flash saat dipanggil
                tktEl.classList.add('scale-110', 'text-secondary');
                setTimeout(() => tktEl.classList.remove('scale-110', 'text-secondary'), 500);

                document.getElementById('d-counter').innerText = now.counter;
                const imgEl = document.getElementById('d-img');
                const iconEl = document.getElementById('d-icon');
                if(imgEl && now.photo) { 
                    imgEl.src = now.photo; imgEl.classList.remove('hidden'); iconEl.classList.add('hidden');
                } else {
                    imgEl.classList.add('hidden'); iconEl.classList.remove('hidden');
                }
                speak(now.ticket, now.counter);
                lastT = now.ticket;
            }
        }

        function speak(t, c) {
            const msg = new SpeechSynthesisUtterance(`Nomor antrian, ${t.replace('-', ' ')}, silahkan menuju ke ${c}`);
            msg.lang = 'id-ID'; msg.rate = 0.85; // Sedikit dilambatkan agar jelas
            speechSynthesis.speak(msg);
        }

        // ==========================================
        // 3. VIEW: STAFF (Teller / CS Counter)
        // ==========================================
        function renderStaff(el) {
            const role = params.get('role') || 'teller';
            const counterName = params.get('name') || `${role.toUpperCase()} 1`;
            
            el.innerHTML = `
                <div class="h-full p-8 flex flex-col gap-6 relative">
                    <!-- Top Status Bar -->
                    <div class="glass rounded-2xl p-5 shadow-sm flex justify-between items-center border-l-8 border-primary">
                        <div class="flex flex-col">
                            <span class="text-xs font-bold text-slate-400 uppercase">Status Modul</span>
                            <span class="font-black text-2xl text-slate-800 tracking-wide">${counterName} <i class="fa-solid fa-circle-check text-green-500 text-lg ml-2"></i></span>
                        </div>
                        <div class="flex gap-8 text-right bg-slate-50 p-3 rounded-xl border">
                            <div class="pr-6 border-r border-slate-200">
                                <div class="text-[10px] font-bold text-slate-400 uppercase">Riwayat Sebelumnya</div>
                                <div id="st-prev" class="text-xl font-bold text-slate-600">-</div>
                            </div>
                            <div>
                                <div class="text-[10px] font-bold text-secondary uppercase animate-pulse">Antrian Menunggu</div>
                                <div id="st-next" class="text-2xl font-black text-secondary">-</div>
                            </div>
                        </div>
                    </div>

                    <!-- Main Dashboard -->
                    <div class="bg-white p-10 rounded-[2.5rem] shadow-xl flex-grow flex gap-12 items-center justify-center relative overflow-hidden">
                        
                        <div class="relative">
                            <div id="s-photo" class="w-80 h-80 bg-slate-50 rounded-[2rem] border-4 border-dashed border-slate-200 flex items-center justify-center overflow-hidden z-10 relative shadow-inner">
                                <i class="fa-solid fa-user text-8xl text-slate-200"></i>
                            </div>
                            <div class="absolute -bottom-4 left-1/2 transform -translate-x-1/2 bg-slate-800 text-white px-6 py-1 rounded-full text-xs font-bold whitespace-nowrap shadow-lg z-20">Foto Wajah Nasabah</div>
                        </div>

                        <div class="flex flex-col flex-grow max-w-xl z-10">
                            <div class="bg-slate-50 border border-slate-100 p-6 rounded-2xl mb-8 text-center relative">
                                <div class="text-sm font-bold text-slate-400 uppercase tracking-widest mb-1">Sedang Dilayani</div>
                                <div id="s-ticket" class="text-[100px] font-black text-primary leading-none mb-2 drop-shadow-sm">-</div>
                                <div id="s-service" class="text-lg text-secondary font-bold inline-block bg-secondary/10 px-4 py-1.5 rounded-lg">-</div>
                            </div>

                            <button onclick="staffAction('call', '${role}', '${counterName}')" class="hover-scale w-full py-6 bg-primary text-white text-2xl font-black rounded-2xl shadow-[0_10px_20px_rgba(0,74,153,0.2)] mb-4 flex items-center justify-center gap-4">
                                <i class="fa-solid fa-bullhorn text-3xl"></i> PANGGIL BERIKUTNYA
                            </button>
                            
                            <div class="grid grid-cols-2 gap-4">
                                <button onclick="staffAction('recall', '${role}', '${counterName}')" class="hover-scale py-5 bg-slate-100 text-slate-700 font-bold rounded-2xl border-2 border-slate-200 hover:bg-slate-200 flex items-center justify-center gap-2 transition-colors">
                                    <i class="fa-solid fa-rotate-right"></i> Panggil Ulang
                                </button>
                                <button onclick="markDone()" class="hover-scale py-5 bg-emerald-500 text-white font-bold rounded-2xl shadow-lg hover:bg-emerald-600 flex items-center justify-center gap-2 transition-colors">
                                    <i class="fa-solid fa-check-double"></i> Layanan Selesai
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            setInterval(() => pollStaffStatus(role), 3000); 
        }

        let lastCalled = "";
        async function staffAction(action, type, counterName) {
            if(action === 'recall' && !lastCalled) return Toast.fire({ icon: 'info', title: 'Belum ada nasabah yang dipanggil.' });
            
            const btn = document.activeElement;
            const originalHtml = btn.innerHTML;
            btn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i> Memproses...`;
            
            try {
                const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action, type, counterName, lastTicket: lastCalled }) });
                const data = await res.json();
                
                if(data.success) {
                    lastCalled = data.ticket;
                    document.getElementById('s-ticket').innerText = data.ticket;
                    document.getElementById('s-service').innerText = data.service || "Umum";
                    if(data.photo) document.getElementById('s-photo').innerHTML = `<img src="${data.photo}" class="w-full h-full object-cover">`;
                    Toast.fire({ icon: 'success', title: `Antrian ${data.ticket} dipanggil.` });
                    pollStaffStatus(type);
                } else { 
                    Swal.fire({ icon: 'info', title: 'Informasi', text: data.msg }); 
                }
            } catch(e) { Toast.fire({ icon: 'error', title: 'Gagal terhubung ke server.' }); }
            finally { btn.innerHTML = originalHtml; }
        }

        function markDone() {
            if(!lastCalled) return;
            document.getElementById('s-ticket').innerText = "-";
            document.getElementById('s-service').innerText = "-";
            document.getElementById('s-photo').innerHTML = `<i class="fa-solid fa-user text-8xl text-slate-200"></i>`;
            lastCalled = "";
            Toast.fire({ icon: 'success', title: 'Transaksi Selesai direkam.' });
        }

        async function pollStaffStatus(role) {
            try {
                const res = await fetch(`${API_URL}?action=getState`);
                const state = await res.json();
                const rData = state[role];
                
                const prev = rData.currentCalled > 1 ? (role==='teller'?'T-':'C-') + (rData.currentCalled - 1) : '-';
                const sisa = rData.lastGenerated - rData.currentCalled;
                const nextStr = sisa > 0 ? `${sisa} Orang` : 'KOSONG';
                
                document.getElementById('st-prev').innerText = prev;
                document.getElementById('st-next').innerText = nextStr;
            } catch(e){}
        }

        // ==========================================
        // 4. VIEW: ADMIN (Master Control)
        // ==========================================
        function renderAdmin(el) {
            el.innerHTML = `
                <div class="p-8 max-w-7xl mx-auto h-full flex flex-col gap-6">
                    
                    <div class="flex justify-between items-end mb-2">
                        <h1 class="text-3xl font-black text-primary flex items-center gap-3"><i class="fa-solid fa-laptop-code"></i> System Configurations</h1>
                        <button onclick="resetQueue()" class="hover-scale bg-red-100 text-red-600 px-6 py-3 rounded-xl font-bold border border-red-200 flex items-center gap-2 shadow-sm">
                            <i class="fa-solid fa-triangle-exclamation"></i> Reset Antrian Hari Ini
                        </button>
                    </div>

                    <div class="grid grid-cols-12 gap-8 overflow-auto pb-20">
                        
                        <!-- Panel Kiri: UI Setting -->
                        <div class="col-span-5 bg-white p-8 rounded-[2rem] shadow-sm border border-slate-200 flex flex-col gap-5">
                            <h2 class="font-black text-lg border-b pb-2 text-slate-700">BRANDING & MULTIMEDIA</h2>
                            
                            <div>
                                <label class="block text-xs font-bold text-slate-400 mb-1">URL LOGO BANK</label>
                                <input id="f-logo" class="w-full p-3 bg-slate-50 border rounded-xl focus:border-primary focus:ring-1 outline-none" value="${config.bankLogo}">
                            </div>
                            
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-xs font-bold text-slate-400 mb-1">WARNA PRIMARY</label>
                                    <input type="color" id="f-c1" class="w-full h-12 rounded cursor-pointer border-none" value="${config.primaryColor}">
                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-slate-400 mb-1">WARNA SECONDARY</label>
                                    <input type="color" id="f-c2" class="w-full h-12 rounded cursor-pointer border-none" value="${config.secondaryColor}">
                                </div>
                            </div>

                            <div>
                                <label class="block text-xs font-bold text-slate-400 mb-1">TIPE MEDIA (BANKING HALL)</label>
                                <select id="f-vtype" class="w-full p-3 bg-slate-50 border rounded-xl font-bold focus:border-primary outline-none">
                                    <option value="youtube" ${config.mediaType === 'youtube' ? 'selected' : ''}>YouTube ID</option>
                                    <option value="local" ${config.mediaType === 'local' ? 'selected' : ''}>Video PC Lokal</option>
                                    <option value="slideshow" ${config.mediaType === 'slideshow' ? 'selected' : ''}>Slideshow URL</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-400 mb-1">SUMBER MEDIA / ID</label>
                                <textarea id="f-vsource" class="w-full p-3 bg-slate-50 border rounded-xl focus:border-primary outline-none" rows="2">${config.mediaSource}</textarea>
                            </div>
                            
                            <div>
                                <label class="block text-xs font-bold text-slate-400 mb-1">RUNNING TEXT</label>
                                <textarea id="f-text" class="w-full p-3 bg-slate-50 border rounded-xl font-bold focus:border-primary outline-none" rows="2">${config.runningText}</textarea>
                            </div>
                        </div>

                        <!-- Panel Kanan: Logical Setting & Data -->
                        <div class="col-span-7 flex flex-col gap-8">
                            
                            <!-- Counter & Hardware -->
                            <div class="bg-white p-8 rounded-[2rem] shadow-sm border border-slate-200 flex flex-col gap-4">
                                <h2 class="font-black text-lg border-b pb-2 text-slate-700">LOGICAL ROUTING & HARDWARE</h2>
                                <div>
                                    <label class="block text-xs font-bold text-slate-400 mb-1">DAFTAR LOKET AKTIF (KOMA)</label>
                                    <textarea id="f-counters" class="w-full p-3 bg-slate-50 border rounded-xl font-bold focus:border-primary outline-none" rows="2">${config.counters.join(', ')}</textarea>
                                </div>
                                <div class="grid grid-cols-2 gap-4">
                                    <div>
                                        <label class="block text-xs font-bold text-slate-400 mb-1">HEADER CETAK RESI</label>
                                        <textarea id="f-cheader" class="w-full p-2 bg-slate-50 border rounded-xl text-sm" rows="2">${config.receiptTemplate.header}</textarea>
                                    </div>
                                    <div>
                                        <label class="block text-xs font-bold text-slate-400 mb-1">FOOTER CETAK RESI</label>
                                        <textarea id="f-cfooter" class="w-full p-2 bg-slate-50 border rounded-xl text-sm" rows="2">${config.receiptTemplate.footer}</textarea>
                                    </div>
                                </div>
                            </div>

                            <!-- Live Report Widget -->
                            <div class="bg-gradient-to-br from-primary to-blue-900 p-8 rounded-[2rem] shadow-xl text-white flex flex-col">
                                <h2 class="font-black text-lg border-b border-white/20 pb-2 mb-6">LIVE SLA METRICS</h2>
                                <div class="grid grid-cols-3 gap-6">
                                    <div class="bg-white/10 p-6 rounded-2xl backdrop-blur-sm border border-white/20">
                                        <div class="text-xs font-bold opacity-70 mb-1">TOTAL ANTRIAN GENERATED</div>
                                        <div id="r-total" class="text-5xl font-black">0</div>
                                    </div>
                                    <div class="bg-white/10 p-6 rounded-2xl backdrop-blur-sm border border-white/20">
                                        <div class="text-xs font-bold opacity-70 mb-1">DILAYANI TELLER</div>
                                        <div id="r-teller" class="text-5xl font-black">0</div>
                                    </div>
                                    <div class="bg-white/10 p-6 rounded-2xl backdrop-blur-sm border border-white/20">
                                        <div class="text-xs font-bold opacity-70 mb-1">DILAYANI CS</div>
                                        <div id="r-cs" class="text-5xl font-black">0</div>
                                    </div>
                                </div>
                            </div>

                        </div>
                    </div>
                    
                    <button onclick="saveAdminConfig()" class="hover-scale fixed bottom-8 right-8 bg-primary text-white px-8 py-4 text-lg font-black rounded-full shadow-[0_10px_25px_rgba(0,74,153,0.4)] flex items-center gap-3 z-50">
                        <i class="fa-solid fa-floppy-disk"></i> SIMPAN PERUBAHAN
                    </button>
                </div>
            `;
            loadAdminReports();
        }

        async function saveAdminConfig() {
            Swal.fire({ title: 'Menyimpan...', allowOutsideClick: false, didOpen: () => { Swal.showLoading() } });
            const newConfig = {
                bankName: config.bankName, displayTemplate: config.displayTemplate, targetPrinter: config.targetPrinter, printMode: config.printMode,
                bankLogo: document.getElementById('f-logo').value,
                primaryColor: document.getElementById('f-c1').value,
                secondaryColor: document.getElementById('f-c2').value,
                mediaType: document.getElementById('f-vtype').value,
                mediaSource: document.getElementById('f-vsource').value,
                runningText: document.getElementById('f-text').value,
                counters: document.getElementById('f-counters').value.split(',').map(s => s.trim()),
                receiptTemplate: { header: document.getElementById('f-cheader').value, footer: document.getElementById('f-cfooter').value }
            };
            try {
                const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'updateConfig', config: newConfig }) });
                if(res.ok) { 
                    Swal.fire('Berhasil!', 'Konfigurasi telah diperbarui.', 'success').then(() => location.reload()); 
                }
            } catch(e) { Swal.fire('Error', 'Gagal menyimpan.', 'error'); }
        }

        async function resetQueue() {
            const result = await Swal.fire({
                title: 'Reset Antrian?',
                text: "Nomor antrian akan kembali ke T-0 dan C-0. Lakukan ini hanya pada pergantian hari / shift.",
                icon: 'warning', showCancelButton: true, confirmButtonColor: '#d33', cancelButtonColor: '#3085d6', confirmButtonText: 'Ya, Reset Sekarang!'
            });
            
            if (result.isConfirmed) {
                Swal.fire({ title: 'Mereset...', allowOutsideClick: false, didOpen: () => { Swal.showLoading() } });
                const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'resetQueue' }) });
                const data = await res.json();
                if(data.success) Swal.fire('Di-reset!', data.msg, 'success');
            }
        }

        async function loadAdminReports() {
            try {
                const res = await fetch(`${API_URL}?action=getReports`);
                const logs = await res.json();
                document.getElementById('r-total').innerText = logs.length;
                let tCount = 0, cCount = 0;
                logs.forEach(row => { if(row[2] === 'teller') tCount++; else cCount++; });
                document.getElementById('r-teller').innerText = tCount;
                document.getElementById('r-cs').innerText = cCount;
            } catch(e){}
        }

        init();
    </script>
</body>
</html>
