<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Antrian Ultimate v11</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800;900&display=swap');
        :root { --p-color: #004A99; --s-color: #F37021; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #F4F7FE; -webkit-font-smoothing: antialiased; }
        
        .bg-primary { background-color: var(--p-color); } .bg-secondary { background-color: var(--s-color); }
        .text-primary { color: var(--p-color); } .text-secondary { color: var(--s-color); }
        .border-primary { border-color: var(--p-color); }
        
        .marquee { white-space: nowrap; animation: scroll 30s linear infinite; }
        @keyframes scroll { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }
        
        @keyframes float { 0% { transform: translateY(0px) scale(1); opacity: 0.3; } 50% { transform: translateY(-30px) scale(1.1); opacity: 0.6; } 100% { transform: translateY(0px) scale(1); opacity: 0.3; } }
        .orb { position: absolute; border-radius: 50%; filter: blur(40px); animation: float 10s ease-in-out infinite; z-index: 1; pointer-events: none; }
        .pulse-heartbeat { animation: heartbeat 1.5s ease-in-out infinite; }
        @keyframes heartbeat { 0% { transform: scale(1); } 20% { transform: scale(1.1); } 40% { transform: scale(1); } 60% { transform: scale(1.1); } 80% { transform: scale(1); } }
        .slide-in-right { animation: slideInRight 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) both; }
        @keyframes slideInRight { 0% { transform: translateX(50px); opacity: 0; } 100% { transform: translateX(0); opacity: 1; } }

        .btn-hover-fx { transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); position: relative; overflow: hidden; }
        .btn-hover-fx::after { content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%; background: linear-gradient(to right, rgba(255,255,255,0), rgba(255,255,255,0.4), rgba(255,255,255,0)); transform: skewX(-25deg); transition: 0.7s; }
        .btn-hover-fx:hover::after { left: 150%; } .btn-hover-fx:hover { transform: translateY(-5px) scale(1.02); } .btn-hover-fx:active { transform: translateY(2px) scale(0.98); }

        ::-webkit-scrollbar { width: 8px; height: 8px; } ::-webkit-scrollbar-track { background: #E2E8F0; } ::-webkit-scrollbar-thumb { background: var(--p-color); border-radius: 10px; }
        @media print { body * { visibility: hidden; } #print-area, #print-area * { visibility: visible; } #print-area { position: absolute; left: 0; top: 0; width: var(--printer-width, 58mm); text-align: center; font-family: 'Courier New', Courier, monospace; color: black; background: white; margin:0; padding:0; } }
        
        .tab-content { display: none; animation: fadeIn 0.3s ease; } .tab-content.active { display: block; } .tab-btn.active { background-color: var(--p-color); color: white; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        #offline-badge { display: none; } body.offline #offline-badge { display: flex; } .counter-offline { opacity: 0.4; filter: grayscale(100%); }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden relative">

    <div id="camera-flash" class="fixed inset-0 bg-white z-[9999] pointer-events-none opacity-0 transition-opacity duration-75"></div>

    <nav id="top-nav" class="bg-white px-8 py-4 flex justify-between items-center shadow-sm z-50">
        <div class="flex items-center gap-5"><img id="nav-logo" src="" class="h-10 object-contain"><div class="h-8 w-px bg-slate-200"></div><span id="nav-bank-name" class="font-black text-xl text-slate-800 uppercase tracking-tight">Memuat...</span></div>
        <div class="flex items-center gap-4">
            <div id="offline-badge" class="bg-red-100 text-red-600 px-4 py-2 rounded-xl font-bold text-sm items-center gap-2 border border-red-200 animate-pulse"><i class="fa-solid fa-wifi"></i> OFFLINE MODE</div>
            <span id="role-badge" class="hidden bg-primary/10 text-primary px-5 py-2 rounded-xl font-bold text-sm tracking-widest border border-primary/20"></span>
            <div id="clock" class="text-xl font-bold text-slate-600 bg-slate-100 px-5 py-2 rounded-xl border border-slate-200">00:00:00</div>
        </div>
    </nav>

    <main id="app-container" class="flex-grow overflow-auto relative bg-[#F4F7FE]"></main>

    <div id="print-area" class="hidden flex flex-col items-center py-4 mx-auto text-black">
        <div id="p-header" class="text-sm font-bold whitespace-pre-line text-center border-b-2 border-dashed border-black pb-2 mb-2 w-full uppercase"></div>
        <div class="text-[10px] mt-2 text-center font-bold" id="p-service"></div>
        <h1 id="p-ticket" class="text-5xl font-black my-2 text-center leading-none"></h1>
        <div id="p-date" class="text-[10px] mb-2 border-b-2 border-dashed border-black pb-2 w-full text-center"></div>
        <div id="p-footer" class="text-xs whitespace-pre-line text-center w-full font-bold"></div>
        <div id="p-disclaimer" class="text-[9px] text-center w-full mt-2 italic font-medium"></div>
    </div>
    <video id="hidden-cam" autoplay playsinline class="hidden"></video>

    <script>
        // MASUKKAN URL GOOGLE APPS SCRIPT DI SINI
        const API_URL = 'https://script.google.com/macros/s/AKfycbxDAZvMYENw9JWkoMcISQSD0cXZU3VCGaiqBURhIBS6ld8ei58WlyCHDRrh0ZgI0-P-fw/exec'; 
        
        const params = new URLSearchParams(window.location.search);
        const view = params.get('view') || 'kiosk';
        
        let config = {}; let slideIndex = 0; let recentCalls = []; let offlineQueue = JSON.parse(localStorage.getItem('offlineQueue') || '[]'); 
        let rawReportData = []; let filteredData = []; let dChartInstance = null; let bChartInstance = null;

        window.addEventListener('online', () => { document.body.classList.remove('offline'); syncOfflineData(); });
        window.addEventListener('offline', () => { document.body.classList.add('offline'); Swal.fire('Koneksi Terputus', 'Beralih ke Offline Mode.', 'warning'); });
        const Toast = Swal.mixin({ toast: true, position: 'top-end', showConfirmButton: false, timer: 3000 });

        function playChime() {
            return new Promise(resolve => {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const playTone = (freq, time, duration) => { const osc = ctx.createOscillator(); const gain = ctx.createGain(); osc.connect(gain); gain.connect(ctx.destination); osc.type = 'sine'; osc.frequency.value = freq; gain.gain.setValueAtTime(0, time); gain.gain.linearRampToValueAtTime(0.3, time + 0.05); gain.gain.exponentialRampToValueAtTime(0.001, time + duration); osc.start(time); osc.stop(time + duration); };
                playTone(659.25, ctx.currentTime, 0.8); playTone(523.25, ctx.currentTime + 0.4, 1.2); setTimeout(resolve, 1400); 
            });
        }

        async function init() {
            if(!navigator.onLine) document.body.classList.add('offline');
            document.getElementById('app-container').innerHTML = `<div class="flex h-full items-center justify-center"><i class="fa-solid fa-spinner fa-spin-pulse text-6xl text-primary"></i></div>`;
            try { const res = await fetch(`${API_URL}?action=getConfig`); config = await res.json(); localStorage.setItem('cachedConfig', JSON.stringify(config)); } 
            catch (e) { config = JSON.parse(localStorage.getItem('cachedConfig') || '{}'); if(!config.bankName) return Swal.fire({ icon: 'error', title: 'Fatal', text: 'Tidak ada cache offline.' }); }
            
            // Set defaults if new features are missing from old DB cache
            if(!config.kioskTheme) config.kioskTheme = "default";
            if(!config.displayTheme) config.displayTheme = "modern-split";

            updateBrand(); renderView(); setInterval(updateClock, 1000);
        }

        function updateClock() { const el = document.getElementById('clock'); if(el) el.innerText = new Date().toLocaleTimeString('id-ID'); }
        function updateBrand() {
            document.documentElement.style.setProperty('--p-color', config.primaryColor); document.documentElement.style.setProperty('--s-color', config.secondaryColor); document.documentElement.style.setProperty('--printer-width', config.printerSize);
            document.getElementById('nav-bank-name').innerText = config.bankName; document.getElementById('nav-logo').src = config.bankLogo;
            const badge = document.getElementById('role-badge'); if(view !== 'display' && view !== 'kiosk') { badge.classList.remove('hidden'); badge.innerText = view === 'staff' ? params.get('name').toUpperCase() : view.toUpperCase(); }
        }

        function renderView() {
            const el = document.getElementById('app-container');
            if(view === 'kiosk') renderKiosk(el); else if(view === 'display') renderDisplay(el); else if(view === 'staff') renderStaff(el); else if(view === 'admin') renderAdmin(el);
        }

        // ==========================================
        // 1. KIOSK NASABAH (3 Themes)
        // ==========================================
        function renderKiosk(el) {
            document.getElementById('top-nav').style.display = 'none';
            
            let bgHTML = ""; let cardClass = ""; let titleColor = "text-white";
            
            if(config.kioskTheme === 'minimalist') {
                bgHTML = `<div class="absolute inset-0 bg-white z-0"></div><div class="absolute inset-0 bg-slate-50 z-0" style="background-image: radial-gradient(var(--p-color) 1px, transparent 1px); background-size: 40px 40px; opacity: 0.05;"></div>`;
                cardClass = "bg-white p-8 rounded-[2rem] shadow-xl border border-slate-200 mt-16 text-center";
                titleColor = "text-slate-800";
            } else if (config.kioskTheme === 'vibrant') {
                bgHTML = `<div class="absolute inset-0 bg-gradient-to-br from-indigo-600 via-primary to-secondary z-0 animate-gradient-x"></div>`;
                cardClass = "bg-white/20 backdrop-blur-lg p-8 rounded-[2rem] shadow-2xl border border-white/40 mt-16 text-center";
            } else { // default (Glassmorphism & Orbs)
                bgHTML = `<div class="orb bg-primary" style="width: 600px; height: 600px; top: -100px; left: -100px; animation-duration: 12s;"></div><div class="orb bg-secondary" style="width: 500px; height: 500px; bottom: -100px; right: -50px; animation-duration: 15s; animation-delay: 2s;"></div><div class="absolute inset-0 bg-slate-900/60 backdrop-blur-xl z-0"></div>`;
                cardClass = "bg-white/10 backdrop-blur-md p-8 rounded-[2.5rem] shadow-2xl border border-white/30 border-t-8 border-t-secondary mt-16 text-center";
            }

            el.innerHTML = `
                <div id="kiosk-ui" class="h-full flex-col relative flex overflow-hidden ${config.kioskTheme==='minimalist'?'bg-white':'bg-slate-900'}">
                    ${bgHTML}
                    <div id="power-screen" class="absolute inset-0 z-50 flex flex-col items-center justify-center bg-slate-900/95 backdrop-blur-md transition-opacity duration-500">
                        <button onclick="startSystem()" class="flex flex-col items-center focus:outline-none hover:scale-110 transition-transform btn-hover-fx rounded-3xl p-10">
                            <div class="w-40 h-40 bg-secondary rounded-full flex items-center justify-center mb-8 shadow-[0_0_80px_rgba(243,112,33,0.8)] pulse-heartbeat"><i class="fa-solid fa-power-off text-7xl text-white"></i></div>
                            <h1 class="text-4xl font-black tracking-widest text-white">AKTIFKAN SISTEM</h1>
                        </button>
                    </div>

                    <div class="z-10 flex flex-col h-full w-full p-12">
                        <div class="flex justify-between items-start mb-6 border-b ${config.kioskTheme==='minimalist'?'border-slate-200':'border-white/20'} pb-8">
                            <img src="${config.bankLogo}" class="h-20 ${config.kioskTheme==='minimalist'?'':'brightness-0 invert filter drop-shadow-md'}">
                            <div class="text-right ${titleColor} max-w-2xl">
                                <h1 class="text-5xl font-black uppercase tracking-widest mb-2 drop-shadow-sm">${config.kioskWelcomeTitle}</h1>
                                <p class="text-xl opacity-80 font-medium">${config.kioskWelcomeDesc}</p>
                            </div>
                        </div>
                        
                        <div class="flex-grow flex flex-col items-center justify-center max-w-7xl mx-auto w-full gap-10">
                            <div class="w-full max-w-2xl ${cardClass} relative">
                                <div class="absolute -top-16 left-1/2 transform -translate-x-1/2"><div class="w-32 h-32 bg-white rounded-full border-[6px] border-slate-100 flex items-center justify-center shadow-xl"><i class="fa-solid fa-hand-pointer text-5xl text-primary pulse-heartbeat"></i></div></div>
                                <div class="pt-10">
                                    <label class="block mb-4 font-black ${config.kioskTheme==='minimalist'?'text-slate-500':'text-white'} text-sm uppercase tracking-widest">Detail Layanan Anda</label>
                                    <select id="spec-service" class="w-full p-5 rounded-2xl text-2xl font-bold bg-white text-slate-800 border-2 border-slate-200 outline-none cursor-pointer shadow-sm">
                                        <option>Setoran / Penarikan Tunai</option><option>Pembukaan Rekening Baru</option><option>Layanan Kredit / Pinjaman</option><option>Customer Service Umum</option>
                                    </select>
                                </div>
                            </div>
                            <div class="grid grid-cols-2 gap-10 w-full max-w-5xl mt-6">
                                <button onclick="takeTicket('teller')" class="btn-hover-fx bg-gradient-to-br from-blue-500 to-blue-800 p-12 rounded-[3rem] text-white flex flex-col items-center justify-center shadow-[0_20px_50px_rgba(0,74,153,0.5)] border border-white/20"><i class="fa-solid fa-vault text-[90px] mb-6 drop-shadow-lg"></i><div class="text-4xl font-black">TELLER</div></button>
                                <button onclick="takeTicket('cs')" class="btn-hover-fx bg-gradient-to-br from-secondary to-orange-500 p-12 rounded-[3rem] text-white flex flex-col items-center justify-center shadow-[0_20px_50px_rgba(243,112,33,0.5)] border border-white/20"><i class="fa-solid fa-user-tie text-[90px] mb-6 drop-shadow-lg"></i><div class="text-4xl font-black">CUSTOMER SERVICE</div></button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        async function startSystem() {
            const popupLeft = (window.screenLeft !== undefined ? window.screenLeft : window.screenX) + (window.innerWidth || screen.width); 
            window.open(window.location.pathname + '?view=display', 'BankingHall', `width=1920,height=1080,left=${popupLeft},top=0`);
            const pScreen = document.getElementById('power-screen'); pScreen.style.opacity = '0'; setTimeout(() => pScreen.classList.add('hidden'), 500);
            try { const stream = await navigator.mediaDevices.getUserMedia({video: true}); document.getElementById('hidden-cam').srcObject = stream; } 
            catch(e) { Swal.fire('Informasi', 'Kamera tidak terdeteksi. Fitur foto dinonaktifkan.', 'info'); }
        }

        async function takeTicket(type) {
            Swal.fire({ title: 'Mencetak...', allowOutsideClick: false, showConfirmButton: false, background: 'rgba(255,255,255,0.9)', didOpen: () => { Swal.showLoading() } });
            const flash = document.getElementById('camera-flash'); flash.style.opacity = '1'; setTimeout(() => flash.style.opacity = '0', 100);
            let photo = ""; const video = document.getElementById('hidden-cam');
            if(video && video.srcObject) { const canvas = document.createElement('canvas'); canvas.width = video.videoWidth; canvas.height = video.videoHeight; canvas.getContext('2d').drawImage(video, 0, 0); photo = canvas.toDataURL('image/jpeg', 0.5); }
            const service = document.getElementById('spec-service').value;

            if(!navigator.onLine) {
                const ticketNo = (type === 'teller' ? 'T-O' : 'C-O') + Math.floor(Math.random()*1000);
                offlineQueue.push({ type, photo, service, timestamp: new Date().getTime(), ticket: ticketNo }); localStorage.setItem('offlineQueue', JSON.stringify(offlineQueue));
                printResi(ticketNo, service); return;
            }

            try {
                const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'generate', type, photo, service }) });
                const data = await res.json(); if(data.success) printResi(data.ticket, service);
            } catch (e) { Swal.fire('Gagal', 'Koneksi ke server terputus.', 'error'); }
        }

        function printResi(ticketNo, service) {
            Swal.close(); Swal.fire({ icon: 'success', title: 'Silahkan Ambil Resi', text: `Nomor Antrian: ${ticketNo}`, timer: 2000, showConfirmButton: false });
            document.getElementById('p-header').innerText = config.receiptTemplate.header; document.getElementById('p-footer').innerText = config.receiptTemplate.footer; document.getElementById('p-disclaimer').innerText = config.receiptTemplate.disclaimer;
            document.getElementById('p-ticket').innerText = ticketNo; document.getElementById('p-service').innerText = "Layanan: " + service; document.getElementById('p-date').innerText = new Date().toLocaleString('id-ID');
            document.getElementById('print-area').classList.remove('hidden'); window.print(); document.getElementById('print-area').classList.add('hidden');
        }

        async function syncOfflineData() {
            if(offlineQueue.length === 0) return;
            try { const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'syncOfflineQueue', payload: offlineQueue }) }); const data = await res.json(); if(data.success) { offlineQueue = []; localStorage.setItem('offlineQueue', '[]'); Toast.fire({ icon: 'success', title: 'Sinkronisasi offline berhasil!' }); } } catch(e) {}
        }

        // ==========================================
        // 2. DISPLAY BANKING HALL (3 Themes)
        // ==========================================
        function renderDisplay(el) {
            document.getElementById('top-nav').style.display = 'none';
            let mediaHtml = config.mediaType === 'youtube' ? `<iframe class="w-full h-full pointer-events-none" src="https://www.youtube.com/embed/${config.mediaSource}?autoplay=1&mute=1&loop=1&playlist=${config.mediaSource}&controls=0" frameborder="0"></iframe>` : `<img id="slide-img" class="w-full h-full object-cover transition-all duration-1000 ease-in-out">`;
            
            let counterGridHTML = config.counters.map(c => `
                <div class="bg-white/10 backdrop-blur-md rounded-2xl overflow-hidden border border-white/20 shadow-lg flex flex-col transition-all duration-500 relative" id="box-${c.replace(/\s+/g, '-')}">
                    <div class="bg-primary/90 backdrop-blur text-white text-center font-bold py-2 text-sm uppercase tracking-widest flex justify-center items-center gap-2">${c} <i class="fa-solid fa-ban text-red-400 hidden" id="icon-break-${c.replace(/\s+/g, '-')}"></i></div>
                    <div class="text-center py-4 text-4xl font-black text-white drop-shadow-md transition-transform duration-300" id="grid-${c.replace(/\s+/g, '-')}">-</div>
                </div>
            `).join('');

            // THematics Engine
            if(config.displayTheme === 'elegant-dark') {
                el.innerHTML = `
                    <div class="flex-grow flex flex-col bg-slate-900 h-screen w-full relative">
                        <div class="absolute inset-0 z-0 opacity-40">${mediaHtml}</div>
                        <div class="absolute inset-0 bg-gradient-to-t from-black via-slate-900/80 to-transparent z-0"></div>
                        <div class="flex-grow flex flex-col items-center justify-center z-10 p-10 relative">
                            <h2 class="text-2xl font-black text-secondary mb-6 uppercase tracking-[0.4em] drop-shadow-lg">PANGGILAN UTAMA</h2>
                            <div class="relative w-80 h-80 rounded-full bg-white/10 backdrop-blur-xl overflow-hidden border-[10px] border-white/20 shadow-2xl flex items-center justify-center z-10 mb-8 transition-transform duration-500" id="d-avatar-container">
                                <img src="" id="d-img" class="w-full h-full object-cover hidden transition-opacity duration-500"><i id="d-icon" class="fa-solid fa-volume-high text-[120px] text-white/50"></i>
                            </div>
                            <div id="d-ticket" class="text-[180px] font-black text-white leading-none mb-4 drop-shadow-2xl transition-transform duration-300">-</div>
                            <div class="flex items-center gap-4 bg-primary px-12 py-5 rounded-full shadow-[0_10px_30px_rgba(0,74,153,0.5)] z-10" id="d-counter-box">
                                <span class="text-white/70 font-bold uppercase text-lg tracking-widest">MENUJU LOKET</span>
                                <div id="d-counter" class="text-5xl font-black text-secondary drop-shadow-md">-</div>
                            </div>
                        </div>
                        <div class="z-10 px-10 pb-8"><div class="grid grid-cols-${Math.min(config.counters.length, 6)} gap-6">${counterGridHTML}</div></div>
                        <div class="h-20 bg-black flex items-center overflow-hidden border-t border-white/10 z-20"><div class="marquee text-3xl text-secondary font-black uppercase tracking-widest drop-shadow-md">${config.runningText}</div></div>
                    </div>
                `;
            } else if(config.displayTheme === 'focus-grid') {
                // Focus Grid (Sidebar Grid Left)
                counterGridHTML = config.counters.map(c => `<div class="bg-white rounded-2xl overflow-hidden border border-slate-200 shadow-sm flex flex-col" id="box-${c.replace(/\s+/g, '-')}"><div class="bg-slate-100 text-slate-500 text-center font-bold py-2 text-sm uppercase tracking-widest flex justify-center items-center gap-2">${c} <i class="fa-solid fa-ban text-red-400 hidden" id="icon-break-${c.replace(/\s+/g, '-')}"></i></div><div class="text-center py-5 text-5xl font-black text-primary" id="grid-${c.replace(/\s+/g, '-')}">-</div></div>`).join('');
                el.innerHTML = `
                    <div class="flex-grow flex flex-col bg-slate-100 h-screen w-full">
                        <div class="flex-grow grid grid-cols-12 h-full">
                            <div class="col-span-4 bg-white border-r border-slate-200 shadow-lg z-10 flex flex-col p-6 overflow-auto">
                                <h2 class="text-lg font-black text-slate-400 mb-6 uppercase tracking-[0.2em] border-b pb-2">Status Loket</h2>
                                <div class="grid grid-cols-1 gap-4">${counterGridHTML}</div>
                            </div>
                            <div class="col-span-8 flex flex-col bg-slate-50 relative overflow-hidden">
                                <div class="h-[60%] w-full relative border-b-8 border-primary shadow-inner">${mediaHtml}</div>
                                <div class="h-[40%] bg-white p-10 flex items-center justify-between shadow-2xl relative z-20">
                                    <div class="flex items-center gap-10">
                                        <div class="relative w-48 h-48 rounded-[2rem] bg-slate-50 overflow-hidden border-4 border-slate-200 shadow-inner flex items-center justify-center transition-transform duration-500" id="d-avatar-container"><img src="" id="d-img" class="w-full h-full object-cover hidden"><i id="d-icon" class="fa-solid fa-volume-high text-[80px] text-slate-300"></i></div>
                                        <div class="flex flex-col">
                                            <span class="text-slate-400 font-bold uppercase tracking-widest mb-2">Panggilan Utama</span>
                                            <div id="d-ticket" class="text-[120px] font-black text-primary leading-none transition-transform duration-300">-</div>
                                        </div>
                                    </div>
                                    <div class="bg-secondary text-white px-10 py-8 rounded-[2rem] text-center shadow-lg" id="d-counter-box">
                                        <div class="text-sm font-bold uppercase tracking-widest opacity-80 mb-2">MENUJU LOKET</div>
                                        <div id="d-counter" class="text-6xl font-black">-</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="h-20 bg-primary flex items-center overflow-hidden relative z-20"><div class="marquee text-4xl text-white font-black uppercase tracking-widest drop-shadow-md">${config.runningText}</div></div>
                    </div>
                `;
            } else {
                // Modern Split (Default)
                el.innerHTML = `
                    <div class="flex-grow flex flex-col bg-slate-900 h-screen w-full">
                        <div class="flex-grow grid grid-cols-12 h-full">
                            <div class="col-span-8 bg-black flex flex-col relative overflow-hidden shadow-2xl">
                                ${mediaHtml}

        function playSlideshow() { const urls = config.mediaSource.split(',').map(s => s.trim()); const el = document.getElementById('slide-img'); if(el && urls.length > 0) { el.style.opacity = 0; setTimeout(() => { el.src = urls[slideIndex]; el.style.opacity = 1; slideIndex = (slideIndex + 1) % urls.length; }, 500); } }

        let lastT = "";
        async function pollDisplay() {
            if(!navigator.onLine) return; 
            try {
                const res = await fetch(`${API_URL}?action=getState`); const state = await res.json();
                if(state.activeCounters) {
                    config.counters.forEach(c => {
                        const elGrid = document.getElementById(`grid-${c.replace(/\s+/g, '-')}`); const elBox = document.getElementById(`box-${c.replace(/\s+/g, '-')}`); const elIcon = document.getElementById(`icon-break-${c.replace(/\s+/g, '-')}`);
                        if(elGrid && elGrid.innerText !== (state.activeCounters[c] || "-")) { elGrid.innerText = state.activeCounters[c] || "-"; elGrid.classList.add('scale-125', 'text-yellow-300'); setTimeout(() => elGrid.classList.remove('scale-125', 'text-yellow-300'), 500); }
                        if(state.counterStatus && (state.counterStatus[c] === 'break' || state.counterStatus[c] === 'offline')) { elBox.classList.add('counter-offline'); elGrid.innerText = "TUTUP"; elIcon.classList.remove('hidden'); } else { elBox.classList.remove('counter-offline'); elIcon.classList.add('hidden'); }
                    });
                }
                const now = state.lastCalled;
                if(now.ticket !== lastT && now.ticket !== "-") {
                    if(lastT !== "" && lastT !== "-") { 
                        recentCalls.unshift({ ticket: document.getElementById('d-ticket').innerText, counter: document.getElementById('d-counter').innerText }); 
                        if(recentCalls.length > 4) recentCalls.pop(); 
                        const rcContainer = document.getElementById('recent-calls-list');
                        if(rcContainer) {
                            rcContainer.innerHTML = recentCalls.map(rc => `
                                <div class="bg-slate-50 border border-slate-100 rounded-xl p-3 flex justify-between items-center shadow-sm slide-in-right">
                                    <div class="font-black text-slate-700 text-2xl">${rc.ticket}</div><div class="text-xs font-bold bg-slate-200 text-slate-600 px-3 py-1 rounded-full uppercase">${rc.counter}</div>
                                </div>`).join('');
                        }
                    }
                    const tktEl = document.getElementById('d-ticket'); tktEl.innerText = now.ticket; document.getElementById('d-counter').innerText = now.counter;
                    tktEl.classList.add('pulse-heartbeat', 'text-secondary'); document.getElementById('d-avatar-container').classList.add('pulse-heartbeat', 'border-secondary'); document.getElementById('d-counter-box').classList.add('bg-secondary');
                    setTimeout(() => { tktEl.classList.remove('pulse-heartbeat', 'text-secondary'); document.getElementById('d-avatar-container').classList.remove('pulse-heartbeat', 'border-secondary'); document.getElementById('d-counter-box').classList.remove('bg-secondary'); }, 2500);
                    
                    const imgEl = document.getElementById('d-img'); const iconEl = document.getElementById('d-icon');
                    if(imgEl && now.photo) { imgEl.src = now.photo; imgEl.classList.remove('hidden'); iconEl.classList.add('hidden'); } else { imgEl.classList.add('hidden'); iconEl.classList.remove('hidden'); }
                    
                    await playChime(); const msg = new SpeechSynthesisUtterance(`Nomor antrian, ${now.ticket.replace('-', ' ')}, silahkan menuju, ${now.counter}`); msg.lang = 'id-ID'; msg.rate = 0.85; speechSynthesis.speak(msg); lastT = now.ticket;
                }
            } catch(e){}
        }

        let lastCalled = ""; let lastPhoto = ""; let lastService = "";
        async function changeStaffStatus(counterName) { const status = document.getElementById('staff-status').value; try { await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'updateStatus', counterName, status }) }); Toast.fire({ icon: 'success', title: `Status Loket diubah.` }); } catch(e){} }
        async function transferQueue(counterName) {
            if(!lastCalled || lastCalled === "-") return Toast.fire({ icon: 'warning', title: 'Belum ada tiket aktif.' });
            const target = await Swal.fire({ title: 'Transfer Antrian', text: `Pindahkan tiket ${lastCalled} ke loket mana?`, input: 'select', inputOptions: { 'teller': 'Antrian TELLER', 'cs': 'Antrian CUSTOMER SERVICE' }, showCancelButton: true, confirmButtonText: 'Transfer Sekarang' });
            if(target.isConfirmed) { 
                Swal.fire({ title: 'Memproses Transfer...', allowOutsideClick: false, didOpen: () => { Swal.showLoading() } }); 
                try { const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'transfer', targetType: target.value, photo: lastPhoto, service: lastService }) }); const data = await res.json(); if(data.success) { Swal.fire('Berhasil Transfer', `Tiket baru: ${data.newTicket}. Silahkan catat di resi.`, 'success'); resetStaffUI(); } } catch(e) { Swal.fire('Error', 'Gagal transfer', 'error'); } 
            }
        }
        async function staffAction(action, type, counterName) {
            if(action === 'recall' && (!lastCalled || lastCalled === "-")) return Toast.fire({ icon: 'info', title: 'Belum ada nasabah.' });
            try { 
                const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action, type, counterName, lastTicket: lastCalled }) }); const data = await res.json(); 
                if(data.success) { 
                    lastCalled = data.ticket; lastPhoto = data.photo || ""; lastService = data.service || "Umum"; 
                    const tktEl = document.getElementById('s-ticket'); tktEl.innerText = data.ticket; tktEl.classList.add('scale-110'); setTimeout(() => tktEl.classList.remove('scale-110'), 300);
                    document.getElementById('s-service').innerText = data.service; 
                    if(data.photo) document.getElementById('s-photo').innerHTML = `<img src="${data.photo}" class="w-full h-full object-cover">`; 
                    Toast.fire({ icon: 'success', title: `Antrian dipanggil.` }); pollStaffStatus(type); 
                } else { Swal.fire('Info', data.msg, 'info'); } 
            } catch(e) { Toast.fire({ icon: 'error', title: 'Gagal koneksi.' }); }
        }
        function markDone() { if(!lastCalled || lastCalled === "-") return; confetti({ particleCount: 150, spread: 80, origin: { y: 0.6 }, colors: [config.primaryColor, config.secondaryColor, '#10B981'] }); resetStaffUI(); Toast.fire({ icon: 'success', title: 'Transaksi Selesai.' }); }

        async function pollStaffStatus(role) { 
            try { 
                const res = await fetch(`${API_URL}?action=getState`); const state = await res.json(); const rData = state[role]; 
                document.getElementById('st-prev').innerText = rData.currentCalled > 1 ? (role==='teller'?'T-':'C-') + (rData.currentCalled - 1) : '-'; 
                const sisa = rData.lastGenerated - rData.currentCalled; const nextEl = document.getElementById('st-next'); nextEl.innerText = sisa > 0 ? `${sisa} Orang` : 'KOSONG'; 
                if(sisa > 5) nextEl.classList.add('text-red-500', 'pulse-heartbeat'); else nextEl.classList.remove('text-red-500', 'pulse-heartbeat');
            } catch(e){} 
        }

                                <div class="grid grid-cols-2 gap-6">
                                    <div><label class="block text-xs font-bold text-slate-500 mb-2">TIPE MEDIA</label><select id="f-vtype" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl font-bold outline-none focus:border-primary transition-colors"><option value="youtube" ${config.mediaType==='youtube'?'selected':''}>YouTube ID</option><option value="slideshow" ${config.mediaType==='slideshow'?'selected':''}>Slideshow URL (Koma)</option></select></div>
                                    <div><label class="block text-xs font-bold text-slate-500 mb-2">SUMBER MEDIA</label><input id="f-vsource" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:border-primary transition-colors" value="${config.mediaSource}"></div>
                                </div>
                            </div>
                        </div>

                        <div id="tab-printer" class="tab-content max-w-4xl pt-16">
                            <h2 class="text-3xl font-black text-slate-800 mb-8 border-b pb-4">Pengaturan Thermal Printer</h2>
                            <div class="bg-white p-8 rounded-3xl shadow-sm border border-slate-100 grid gap-6">
                                <div><label class="block text-xs font-bold text-slate-500 mb-2">UKURAN KERTAS</label><select id="f-psize" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl font-bold outline-none focus:border-primary transition-colors"><option value="58mm" ${config.printerSize==='58mm'?'selected':''}>58mm (Kecil)</option><option value="80mm" ${config.printerSize==='80mm'?'selected':''}>80mm (Besar)</option></select></div>
                                <div class="grid grid-cols-2 gap-6"><div><label class="block text-xs font-bold text-slate-500 mb-2">HEADER TEKS</label><textarea id="f-cheader" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl text-sm outline-none focus:border-primary transition-colors" rows="3">${config.receiptTemplate.header}</textarea></div><div><label class="block text-xs font-bold text-slate-500 mb-2">FOOTER TEKS</label><textarea id="f-cfooter" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl text-sm outline-none focus:border-primary transition-colors" rows="3">${config.receiptTemplate.footer}</textarea></div></div>
                                <div><label class="block text-xs font-bold text-slate-500 mb-2">DISCLAIMER BAWAH</label><input id="f-cdisc" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl italic outline-none focus:border-primary transition-colors" value="${config.receiptTemplate.disclaimer}"></div>
                            </div>
                        </div>

                        <div id="tab-counter" class="tab-content max-w-5xl pt-16">
                            <h2 class="text-3xl font-black text-slate-800 mb-8 border-b pb-4">Manajemen Loket & Staff (GUI Generator)</h2>
                            <div class="bg-white p-8 rounded-3xl shadow-sm border border-slate-100 grid gap-6 mb-6">
                                <div><label class="block text-xs font-bold text-slate-500 mb-2">PILIH TEMA DASHBOARD STAFF</label>
                                    <div class="grid grid-cols-3 gap-4">
                                        <div onclick="selectTheme('counter', 'light')" id="theme-counter-light" class="theme-card-counter border-2 p-4 rounded-xl cursor-pointer transition-all hover:bg-slate-50 text-center ${config.counterTheme==='light'?'border-primary bg-blue-50 ring-4 ring-primary/20':'border-slate-200'}">
                                            <div class="h-10 bg-white border rounded-lg mb-3"></div><div class="font-bold text-sm">Light Mode</div>
                                        </div>
                                        <div onclick="selectTheme('counter', 'dark')" id="theme-counter-dark" class="theme-card-counter border-2 p-4 rounded-xl cursor-pointer transition-all hover:bg-slate-50 text-center ${config.counterTheme==='dark'?'border-primary bg-blue-50 ring-4 ring-primary/20':'border-slate-200'}">
                                            <div class="h-10 bg-slate-900 rounded-lg mb-3"></div><div class="font-bold text-sm">Dark Mode</div>
                                        </div>
                                        <div onclick="selectTheme('counter', 'brand')" id="theme-counter-brand" class="theme-card-counter border-2 p-4 rounded-xl cursor-pointer transition-all hover:bg-slate-50 text-center ${config.counterTheme==='brand'?'border-primary bg-blue-50 ring-4 ring-primary/20':'border-slate-200'}">
                                            <div class="h-10 bg-primary rounded-lg mb-3"></div><div class="font-bold text-sm">Brand Mode</div>
                                        </div>
                                    </div>
                                    <input type="hidden" id="f-ctheme" value="${config.counterTheme}">
                                </div>
                            </div>

                            <div class="bg-white p-8 rounded-3xl shadow-sm border border-slate-100">
                                <h3 class="font-black text-slate-800 mb-4 flex items-center gap-2"><i class="fa-solid fa-users-gear text-primary"></i> Daftar Loket Aktif</h3>
                                <div id="counter-manager-list" class="flex flex-col gap-3 mb-6"></div>
                                <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 flex gap-3 items-end">
                                    <div class="flex-grow"><label class="block text-xs font-bold text-slate-500 mb-1">Tambah Loket Baru</label><input type="text" id="new-counter-name" placeholder="Misal: CS 3 Prioritas" class="w-full p-3 border border-slate-300 rounded-lg outline-none focus:border-primary font-bold"></div>
                                    <button onclick="addCounterGUI()" class="bg-primary text-white px-6 py-3 rounded-lg font-bold hover:bg-blue-800 h-[46px]"><i class="fa-solid fa-plus mr-2"></i> Tambah</button>
                                </div>
                                <p class="text-[10px] text-slate-400 mt-4 italic">*Sistem otomatis mendeteksi peran (Teller/CS) dari nama loket. Copy link URL dan berikan ke PC staf bersangkutan.</p>
                            </div>
                        </div>

                        <!-- TAB REPORT WITH CHART.JS -->
                        <div id="tab-report" class="tab-content w-full pt-16">
                            <div class="flex justify-between items-center mb-6">
                                <h2 class="text-3xl font-black text-slate-800">Visual Analytics & Laporan</h2>
                                <button onclick="exportCSV()" class="btn-hover-fx bg-emerald-100 text-emerald-700 px-6 py-2 rounded-xl font-bold border border-emerald-200 shadow-sm"><i class="fa-solid fa-file-csv mr-2"></i> Export Data CSV</button>
                            </div>
                            
                            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 flex gap-4 items-end mb-6">
                                <div><label class="block text-xs font-bold text-slate-500 mb-1">Dari Tanggal</label><input type="date" id="filter-start" class="p-2 border rounded-lg bg-slate-50 font-bold text-sm outline-none focus:border-primary"></div>
                                <div><label class="block text-xs font-bold text-slate-500 mb-1">Sampai Tanggal</label><input type="date" id="filter-end" class="p-2 border rounded-lg bg-slate-50 font-bold text-sm outline-none focus:border-primary"></div>
                                <button onclick="applyReportFilter()" class="bg-slate-800 text-white px-6 py-2 rounded-lg font-bold hover:bg-slate-700 h-[42px] transition-colors"><i class="fa-solid fa-filter mr-2"></i> Terapkan Filter</button>
                            </div>

                            <div class="grid grid-cols-3 gap-6 mb-6">
                                <div class="col-span-1 bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex flex-col items-center justify-center">
                                    <h3 class="text-xs font-bold text-slate-500 uppercase tracking-widest mb-4">Distribusi Layanan</h3>
                                    <div class="relative w-full aspect-square"><canvas id="doughnutChart"></canvas></div>
                                </div>
                                <div class="col-span-2 bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                                    <h3 class="text-xs font-bold text-slate-500 uppercase tracking-widest mb-4">Trafik Kunjungan per Jam</h3>
                                    <div class="relative w-full h-[250px]"><canvas id="barChart"></canvas></div>
                                </div>
                            </div>
                            <div class="grid grid-cols-5 gap-4 mb-6" id="dynamic-staff-stats"></div>
                            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex flex-col h-[400px]">
                                <h3 class="text-xs font-bold text-slate-500 uppercase tracking-widest mb-4"><i class="fa-solid fa-table-list mr-2"></i> Log Database Detail</h3>
                                <div class="flex-grow overflow-auto rounded-xl border border-slate-200">
                                    <table class="w-full text-left text-sm" id="reportTable">
                                        <thead class="bg-slate-50 sticky top-0 z-10 shadow-sm">
                                            <tr class="text-slate-600 font-bold text-xs uppercase"><th class="p-4 border-b">WAKTU CETAK</th><th class="p-4 border-b">WAKTU PANGGIL</th><th class="p-4 border-b">TIKET / LOKET</th><th class="p-4 border-b">KEPERLUAN</th><th class="p-4 border-b text-center">FOTO</th></tr>
                                        </thead>
                                        <tbody id="r-table-body" class="divide-y divide-slate-100"></tbody>
                                    </table>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>
            `;
            renderCounterManagerGUI();
            loadAdminReports();
        }

        function renderAdminLock(el) { 
            document.getElementById('top-nav').style.display = 'none'; 
            el.innerHTML = `
                <div class="h-full flex items-center justify-center bg-slate-900 relative">
                    <div class="orb bg-primary" style="width: 400px; height: 400px; top: 10%; left: 20%;"></div>
                    <div class="bg-white/10 backdrop-blur-xl p-10 rounded-[3rem] shadow-2xl text-center max-w-sm w-full border border-white/20 z-10">
                        <i class="fa-solid fa-shield-halved text-6xl text-white mb-6"></i>
                        <h2 class="text-2xl font-black text-white mb-2">Otorisasi Admin</h2>
                        <p class="text-sm text-white/70 font-medium mb-8">Masukkan PIN (Default: 123456)</p>
                        <input type="password" id="admin-pin" class="w-full text-center text-3xl font-black tracking-[0.5em] p-4 bg-white/20 text-white border-2 border-white/30 rounded-2xl mb-6 outline-none focus:border-white transition-colors placeholder-white/30" placeholder="••••••" maxlength="6">
                        <button onclick="checkPin()" class="btn-hover-fx w-full bg-white text-slate-900 py-4 rounded-xl font-black shadow-lg">BUKA DASHBOARD</button>
                    </div>
                </div>
            `; 
        }

        function checkPin() { 
            if(document.getElementById('admin-pin').value === '123456') { 
                sessionStorage.setItem('adminUnlocked', 'true'); document.getElementById('top-nav').style.display = 'flex'; renderAdmin(document.getElementById('app-container')); 
            } else { Swal.fire({icon: 'error', title: 'Akses Ditolak', text: 'PIN Salah'}); document.getElementById('admin-pin').value = ''; } 
        }
        function lockAdmin() { sessionStorage.removeItem('adminUnlocked'); renderAdminLock(document.getElementById('app-container')); }

        function switchTab(tabId, btn) { 
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active')); 
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active')); 
            document.getElementById(tabId).classList.add('active'); btn.classList.add('active'); 
        }

        // Theme Selection Helper
        function selectTheme(category, themeName) {
            document.getElementById(`f-${category.charAt(0)}theme`).value = themeName;
            document.querySelectorAll(`.theme-card-${category}`).forEach(el => el.classList.remove('border-primary', 'bg-blue-50', 'ring-4', 'ring-primary/20'));
            const selectedCard = document.getElementById(`theme-${category}-${themeName}`);
            if(selectedCard) selectedCard.classList.add('border-primary', 'bg-blue-50', 'ring-4', 'ring-primary/20');
        }

        // GUI Counter Manager Builder
        function renderCounterManagerGUI() {
            const baseUrl = window.location.origin + window.location.pathname;
            const container = document.getElementById('counter-manager-list');
            if(!container) return;
            container.innerHTML = config.counters.map((c, idx) => {
                let role = c.toLowerCase().includes('cs') ? 'cs' : 'teller';
                let link = `${baseUrl}?view=staff&role=${role}&name=${encodeURIComponent(c)}`;
                return `
                    <div class="flex items-center gap-3 bg-white p-3 rounded-xl border border-slate-200 shadow-sm">
                        <div class="font-black text-slate-700 w-40 truncate uppercase text-sm flex items-center gap-2"><i class="fa-solid ${role==='teller'?'fa-vault text-blue-500':'fa-user-tie text-orange-500'}"></i> ${c}</div>
                        <input type="text" readonly value="${link}" class="flex-grow text-[11px] p-2 bg-slate-50 border border-slate-100 rounded outline-none text-slate-500 font-mono">
                        <button onclick="copyToClipboard('${link}')" class="bg-slate-800 text-white px-4 py-2 rounded font-bold text-xs hover:bg-black transition-colors" title="Copy Link URL"><i class="fa-solid fa-copy"></i> Copy Link</button>
                        <button onclick="removeCounterGUI(${idx})" class="bg-red-50 text-red-500 px-4 py-2 rounded font-bold text-xs hover:bg-red-100 transition-colors"><i class="fa-solid fa-trash"></i></button>
                    </div>
                `;
            }).join('');
        }
        function addCounterGUI() {
            const name = document.getElementById('new-counter-name').value.trim();
            if(name) { config.counters.push(name); renderCounterManagerGUI(); document.getElementById('new-counter-name').value = ''; }
        }
        function removeCounterGUI(idx) { config.counters.splice(idx, 1); renderCounterManagerGUI(); }
        function copyToClipboard(text) { navigator.clipboard.writeText(text).then(() => Toast.fire({icon: 'success', title: 'URL Link dicopy!'})); }

        // --- Chart.js & Advanced Analytics Logic ---
        async function loadAdminReports() { 
            try { 
                const res = await fetch(`${API_URL}?action=getReports`); rawReportData = await res.json(); 
                const today = new Date().toLocaleDateString('en-CA', {timeZone: 'Asia/Makassar'});
                document.getElementById('filter-start').value = today; document.getElementById('filter-end').value = today; 
                applyReportFilter(); 
            } catch(e){} 
        }
        
        function applyReportFilter() { 
            const start = new Date(document.getElementById('filter-start').value); start.setHours(0,0,0,0); 
            const end = new Date(document.getElementById('filter-end').value); end.setHours(23,59,59,999); 
            filteredData = rawReportData.filter(row => { 
                if(!row[0]) return false; const rDate = new Date(row[0]); return rDate >= start && rDate <= end; 
            }); 
            renderReportTableAndCharts(); 
        }
        
        function renderReportTableAndCharts() {
            const tbody = document.getElementById('r-table-body'); tbody.innerHTML = ''; 
            let staffStats = {}; let total = filteredData.length; let hourlyData = {}; let typeCount = { teller: 0, cs: 0 };
            
            filteredData.slice().reverse().forEach(row => {
                let staffName = row[3] || 'Belum Dipanggil'; if(row[4] === 'TRANSFERRED') staffName = 'Ditransfer'; staffStats[staffName] = (staffStats[staffName] || 0) + 1;
                if(row[2] === 'teller') typeCount.teller++; else typeCount.cs++;
                if(row[0]) { const hour = new Date(row[0]).getHours(); hourlyData[hour] = (hourlyData[hour] || 0) + 1; }

                const printDateStr = row[0] ? new Date(row[0]).toLocaleString('id-ID') : '-'; const callDateStr = row[7] ? new Date(row[7]).toLocaleTimeString('id-ID') : '<span class="text-slate-300 italic">Menunggu...</span>'; const photoHtml = row[5] ? `<img src="${row[5]}" class="w-10 h-10 object-cover rounded-full border border-slate-200 mx-auto transition-transform hover:scale-150">` : '-';
                const tr = document.createElement('tr'); tr.className = "hover:bg-slate-50 transition-colors";
                tr.innerHTML = `<td class="p-4 font-medium text-slate-600">${printDateStr}</td><td class="p-4 font-bold text-slate-800">${callDateStr}</td><td class="p-4"><span class="bg-${row[2]==='teller'?'blue':'orange'}-100 text-${row[2]==='teller'?'primary':'secondary'} px-3 py-1 rounded-lg font-black shadow-sm">${row[1]}</span><div class="text-[10px] mt-1 font-bold text-slate-400 uppercase tracking-widest">${row[3] || ''}</div></td><td class="p-4 font-medium text-slate-600">${row[6]}</td><td class="p-4 text-center">${photoHtml}</td>`; 
                tbody.appendChild(tr);
            });
            
            let statsHtml = `<div class="bg-primary p-4 rounded-2xl shadow-md text-white transition-transform hover:-translate-y-1"><div class="text-[10px] font-bold opacity-80 uppercase tracking-widest">Total Antrian</div><div class="text-4xl font-black mt-1">${total}</div></div>`;
            Object.keys(staffStats).forEach(name => { if(name !== 'Belum Dipanggil' && name !== 'Ditransfer') { statsHtml += `<div class="bg-white border border-slate-100 p-4 rounded-2xl shadow-sm transition-transform hover:-translate-y-1"><div class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">${name}</div><div class="text-3xl font-black text-slate-700 mt-1">${staffStats[name]}</div></div>`; } }); 
            document.getElementById('dynamic-staff-stats').innerHTML = statsHtml;
            renderCharts(typeCount, hourlyData);
        }

        function renderCharts(typeCount, hourlyData) {
            const dCtx = document.getElementById('doughnutChart').getContext('2d');
            if(dChartInstance) dChartInstance.destroy();
            dChartInstance = new Chart(dCtx, {
                type: 'doughnut', data: { labels: ['Teller', 'Customer Service'], datasets: [{ data: [typeCount.teller, typeCount.cs], backgroundColor: [config.primaryColor, config.secondaryColor], borderWidth: 0 }] },
                options: { responsive: true, maintainAspectRatio: false, cutout: '70%', plugins: { legend: { position: 'bottom' } } }
            });

            const bCtx = document.getElementById('barChart').getContext('2d');
            if(bChartInstance) bChartInstance.destroy();
            const labels = Array.from({length: 9}, (_, i) => `${i+8}:00`); const data = labels.map((_, i) => hourlyData[i+8] || 0);
            bChartInstance = new Chart(bCtx, {
                type: 'bar', data: { labels: labels, datasets: [{ label: 'Jumlah Antrian', data: data, backgroundColor: config.primaryColor, borderRadius: 5 }] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } } }
            });
        }
        
        function exportCSV() { 
            if(filteredData.length === 0) return Swal.fire('Kosong', 'Tidak ada data untuk diekspor.', 'info'); 
            let csvContent = "data:text/csv;charset=utf-8,Waktu Cetak,Nomor Tiket,Tipe,Nama Loket,Status,Keperluan,Waktu Panggil\n"; 
            filteredData.forEach(row => { csvContent += `${row[0]},${row[1]},${row[2]},${row[3]},${row[4]},"${row[6]}",${row[7]}\r\n`; }); 
            const link = document.createElement("a"); link.setAttribute("href", encodeURI(csvContent)); link.setAttribute("download", "Laporan_Antrian_SLA.csv"); document.body.appendChild(link); link.click(); document.body.removeChild(link); 
        }
        
        async function saveAdminConfig() { 
            Swal.fire({ title: 'Menyimpan...', allowOutsideClick: false, didOpen: () => { Swal.showLoading() } }); 
            const newConfig = { 
                bankName: document.getElementById('f-bname').value, bankLogo: document.getElementById('f-logo').value, primaryColor: document.getElementById('f-c1').value, secondaryColor: document.getElementById('f-c2').value, 
                kioskWelcomeTitle: document.getElementById('f-ktitle').value, kioskWelcomeDesc: document.getElementById('f-kdesc').value, 
                runningText: document.getElementById('f-text').value, mediaType: document.getElementById('f-vtype').value, mediaSource: document.getElementById('f-vsource').value, 
                printerSize: document.getElementById('f-psize').value, receiptTemplate: { header: document.getElementById('f-cheader').value, footer: document.getElementById('f-cfooter').value, disclaimer: document.getElementById('f-cdisc').value }, 
                counters: config.counters, /* Ambil dari variabel global config karena dikelola oleh GUI Builder */
                kioskTheme: document.getElementById('f-ktheme').value, displayTheme: document.getElementById('f-dtheme').value, counterTheme: document.getElementById('f-ctheme').value 
            }; 
            try { 
                const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'updateConfig', config: newConfig }) }); 
                if(res.ok) { Swal.fire('Berhasil!', 'Sistem diperbarui.', 'success').then(() => location.reload()); } 
            } catch(e) { Swal.fire('Error', 'Gagal menyimpan.', 'error'); } 
        }
        
        async function resetQueue() { 
            const result = await Swal.fire({ title: 'Reset Antrian?', text: "Kembali ke T-0. Lakukan hanya jika Auto-Reset bermasalah.", icon: 'warning', showCancelButton: true, confirmButtonColor: '#d33', confirmButtonText: 'Reset Sekarang' }); 
            if (result.isConfirmed) { 
                Swal.fire({ title: 'Mereset...', allowOutsideClick: false, didOpen: () => { Swal.showLoading() } }); 
                const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'resetQueue' }) }); 
                const data = await res.json(); 
                if(data.success) Swal.fire('Selesai!', data.msg, 'success'); 
            } 
        }
        
        // Eksekusi Sistem Utama
        init();
    </script>
</body>
</html>
