<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Superapp Antrian v21</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#004A99">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="https://cdn.lordicon.com/lordicon.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800;900&display=swap');
        :root { --p-color: #004A99; --s-color: #F37021; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #F4F7FE; -webkit-font-smoothing: antialiased; }
        .bg-primary { background-color: var(--p-color); } .bg-secondary { background-color: var(--s-color); }
        .text-primary { color: var(--p-color); } .text-secondary { color: var(--s-color); }
        .border-primary { border-color: var(--p-color); }
        
        .marquee { white-space: nowrap; animation: scroll 30s linear infinite; }
        @keyframes scroll { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }
        
        /* Sci-Fi Scanner Animation */
        .scanner-hud { position: absolute; inset: 0; pointer-events: none; border: 4px solid rgba(0,255,255,0.5); z-index: 50; display: none; }
        .scanner-hud::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: #00ffcc; box-shadow: 0 0 15px #00ffcc, 0 0 30px #00ffcc; animation: scanline 1.2s ease-in-out infinite alternate; }
        @keyframes scanline { 0% { top: 0%; opacity: 0.5; } 50% { opacity: 1; } 100% { top: 98%; opacity: 0.5; } }
        .scanner-active .scanner-hud { display: block; }
        
        /* Sonic Ripple Radar (TV) */
        .ripple-fx { animation: ripple-animation 1.5s linear infinite; }
        @keyframes ripple-animation { 0% { box-shadow: 0 0 0 0 rgba(243, 112, 33, 0.7); } 100% { box-shadow: 0 0 0 150px rgba(243, 112, 33, 0); } }

        /* Skeleton Loading */
        .skeleton-box { animation: skeleton-pulse 1.5s ease-in-out infinite; background: linear-gradient(90deg, #e2e8f0 25%, #f8fafc 50%, #e2e8f0 75%); background-size: 200% 100%; border-radius: 1rem; }
        @keyframes skeleton-pulse { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

        /* Drag & Drop */
        .drag-over { border: 2px dashed var(--p-color) !important; background-color: #eff6ff !important; transform: scale(1.02); }
        .dragging { opacity: 0.5; }

        @keyframes float { 0% { transform: translateY(0px) scale(1); opacity: 0.3; } 50% { transform: translateY(-30px) scale(1.1); opacity: 0.6; } 100% { transform: translateY(0px) scale(1); opacity: 0.3; } }
        .orb { position: absolute; border-radius: 50%; filter: blur(40px); animation: float 10s ease-in-out infinite; z-index: 1; pointer-events: none; }
        .pulse-heartbeat { animation: heartbeat 1.5s ease-in-out infinite; }
        @keyframes heartbeat { 0% { transform: scale(1); } 20% { transform: scale(1.1); } 40% { transform: scale(1); } 60% { transform: scale(1.1); } 80% { transform: scale(1); } }
        .btn-hover-fx { transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); position: relative; overflow: hidden; }
        .btn-hover-fx::after { content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%; background: linear-gradient(to right, rgba(255,255,255,0), rgba(255,255,255,0.4), rgba(255,255,255,0)); transform: skewX(-25deg); transition: 0.7s; }
        .btn-hover-fx:hover::after { left: 150%; } .btn-hover-fx:hover { transform: translateY(-5px) scale(1.02); } .btn-hover-fx:active { transform: translateY(2px) scale(0.98); }
        ::-webkit-scrollbar { width: 8px; height: 8px; } ::-webkit-scrollbar-track { background: #E2E8F0; } ::-webkit-scrollbar-thumb { background: var(--p-color); border-radius: 10px; }
        
        @media print { body * { display: none; } #print-area, #print-area * { display: block; visibility: visible; } #print-area { position: absolute; left: 0; top: 0; width: var(--printer-width, 58mm); font-family: 'Courier New', Courier, monospace; color: black; background: white; margin:0; padding:0; } #print-area.theme-minimalist { border: none; padding: 2mm; text-align: left; } #print-area.theme-standard { text-align: center; border: 1px dashed black; padding: 4mm; } #print-area.theme-detailed { text-align: center; border: 2px solid black; border-radius: 4px; padding: 4mm; } }
        .ui-preview-box { height: 100px; width: 100%; border-radius: 8px; background-size: cover; background-position: center; border: 2px solid #e2e8f0; transition: 0.3s; } .theme-selected .ui-preview-box { border-color: var(--p-color); box-shadow: 0 0 0 4px rgba(0,74,153,0.2); }
        .tab-content { display: none; animation: fadeIn 0.3s ease; } .tab-content.active { display: block; } .tab-btn.active { background-color: var(--p-color); color: white; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        #offline-badge { display: none; } body.offline #offline-badge { display: flex; } .counter-offline { opacity: 0.4; filter: grayscale(100%); }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden relative">

    <div id="camera-flash" class="fixed inset-0 bg-white z-[9999] pointer-events-none opacity-0 transition-opacity duration-75"></div>

    <nav id="top-nav" class="bg-white px-8 py-4 flex justify-between items-center shadow-sm z-50">
        <div class="flex items-center gap-5"><img id="nav-logo" src="" class="h-10 object-contain"><div class="h-8 w-px bg-slate-200"></div><span id="nav-bank-name" class="font-black text-xl text-slate-800 uppercase tracking-tight">Memuat...</span></div>
        <div class="flex items-center gap-4">
            <div id="offline-badge" class="bg-red-100 text-red-600 px-4 py-2 rounded-xl font-bold text-sm items-center gap-2 border border-red-200 animate-pulse"><i class="fa-solid fa-wifi"></i> OFFLINE MODE</div>
            <span id="role-badge" class="hidden bg-primary/10 text-primary px-5 py-2 rounded-xl font-bold text-sm tracking-widest border border-primary/20"></span>
            <div id="clock" class="text-xl font-bold text-slate-600 bg-slate-100 px-5 py-2 rounded-xl border border-slate-200">00:00:00</div>
        </div>
    </nav>
    <main id="app-container" class="flex-grow overflow-auto relative bg-[#F4F7FE]"></main>

    <div id="print-area" class="hidden flex flex-col mx-auto text-black">
        <div id="p-header" class="text-sm font-bold whitespace-pre-line text-center border-b-2 border-dashed border-black pb-2 w-full uppercase"></div>
        <div class="text-[10px] mt-2 text-center font-bold uppercase tracking-widest text-slate-500" id="p-service"></div>
        <h1 id="p-ticket" class="text-5xl font-black my-2 text-center leading-none"></h1>
        <div id="p-date" class="text-[10px] mb-2 border-b-2 border-dashed border-black pb-2 w-full text-center"></div>
        <div id="p-footer" class="text-xs whitespace-pre-line text-center w-full font-bold"></div>
        <div id="p-disclaimer" class="text-[9px] text-center w-full mt-2 italic font-medium"></div>
    </div>
    
    <script>
        if ('serviceWorker' in navigator) { window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(()=>{}); }); }

        // ==========================================
        // GANTI DENGAN URL DEPLOYMENT BARU GOOGLE APPS SCRIPT ANDA
        // ==========================================
        const API_URL = 'https://script.google.com/macros/s/AKfycbwJorVZtTvgkZSHf29SrKHuIm4HIYizPiPFCeUPbPM5ZQbGwq-w1UBh6to5vFlMAnOBuw/exec'; 
        
        const params = new URLSearchParams(window.location.search);
        const view = params.get('view') || 'kiosk';
        
        let config = {}; window.currentConfigVersion = "0";
        let playlistIndex = 0; let playlistTimer = null; 
        let recentCalls = []; let offlineQueue = JSON.parse(localStorage.getItem('offlineQueue') || '[]'); 
        let rawReportData = []; let filteredData = []; let dChartInstance = null; let bChartInstance = null; let voices = [];
        let hardwareSettings = JSON.parse(localStorage.getItem('hardwareSettings') || '{"camera":"", "printer":""}');
        
        let lastCallTimestamp = 0; let weatherData = { temp: "30", icon: "fa-sun" };
        let lastCalled = ""; let lastPhoto = ""; let lastService = "";
        let ytPlayer = null; 

        window.addEventListener('online', () => { document.body.classList.remove('offline'); syncOfflineData(); });
        window.addEventListener('offline', () => { document.body.classList.add('offline'); Swal.fire('Koneksi Terputus', 'Beralih ke Offline Mode.', 'warning'); });
        const Toast = Swal.mixin({ toast: true, position: 'top-end', showConfirmButton: false, timer: 3000 });

        async function fetchAPI(action) { const res = await fetch(`${API_URL}?action=${action}&_t=${new Date().getTime()}`); if(!res.ok) throw new Error(); return res.json(); }
        async function fetchPost(payload) { const res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) }); if(!res.ok) throw new Error(); return res.json(); }

        async function checkConfigUpdate(serverVersion) {
            if (window.currentConfigVersion && serverVersion && window.currentConfigVersion !== serverVersion && serverVersion !== "0") {
                config = await fetchAPI('getConfig'); localStorage.setItem('cachedConfig', JSON.stringify(config)); window.currentConfigVersion = serverVersion;
                updateBrand(); renderView(); Toast.fire({ icon: 'info', title: 'Sinkronisasi Real-Time Berhasil.' });
            }
        }

        // --- AUDIO ENGINE ---
        function loadVoices() { voices = speechSynthesis.getVoices(); if(view === 'admin') populateVoiceSelect(); }
        speechSynthesis.onvoiceschanged = loadVoices;
        function playChime() {
            return new Promise(resolve => {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const playTone = (freq, time, duration) => { const osc = ctx.createOscillator(); const gain = ctx.createGain(); osc.connect(gain); gain.connect(ctx.destination); osc.type = 'sine'; osc.frequency.value = freq; gain.gain.setValueAtTime(0, time); gain.gain.linearRampToValueAtTime(0.3, time + 0.05); gain.gain.exponentialRampToValueAtTime(0.001, time + duration); osc.start(time); osc.stop(time + duration); };
                playTone(659.25, ctx.currentTime, 0.8); playTone(523.25, ctx.currentTime + 0.4, 1.2); setTimeout(resolve, 1400); 
            });
        }
        function playSciFiScanner() {
            const ctx = new (window.AudioContext || window.webkitAudioContext)(); const osc = ctx.createOscillator(); const gain = ctx.createGain();
            osc.connect(gain); gain.connect(ctx.destination); osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, ctx.currentTime); osc.frequency.exponentialRampToValueAtTime(800, ctx.currentTime + 1.2);
            gain.gain.setValueAtTime(0.1, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.2);
            osc.start(); osc.stop(ctx.currentTime + 1.2);
        }

        // --- WEATHER ENGINE ---
        async function fetchWeather() {
            try {
                const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${config.weatherLocation?.lat||-1.2691}&longitude=${config.weatherLocation?.lon||116.8252}&current=temperature_2m,weather_code`);
                const data = await res.json(); weatherData.temp = Math.round(data.current.temperature_2m);
                const code = data.current.weather_code;
                if(code <= 3) weatherData.icon = 'fa-cloud-sun text-yellow-400'; else if(code <= 48) weatherData.icon = 'fa-smog text-slate-300'; else if(code <= 67) weatherData.icon = 'fa-cloud-rain text-blue-400'; else if(code <= 99) weatherData.icon = 'fa-cloud-bolt text-indigo-500'; else weatherData.icon = 'fa-sun text-yellow-500';
                const wEl = document.getElementById('tv-weather'); if(wEl) wEl.innerHTML = `<i class="fa-solid ${weatherData.icon} mr-2"></i> ${weatherData.temp}°C`;
            } catch(e) {}
        }

        async function init() {
            loadVoices();
            if(!navigator.onLine) document.body.classList.add('offline');
            
            // SKELETON LOADER
            document.getElementById('app-container').innerHTML = `<div class="flex flex-col h-full w-full p-10 gap-6"><div class="skeleton-box h-24 w-full"></div><div class="flex-grow flex gap-6"><div class="skeleton-box w-1/3"></div><div class="skeleton-box w-2/3"></div></div></div>`;
            
            try { config = await fetchAPI('getConfig'); localStorage.setItem('cachedConfig', JSON.stringify(config)); } 
            catch (e) { config = JSON.parse(localStorage.getItem('cachedConfig') || '{}'); if(!config.bankName) return Swal.fire({ icon: 'error', title: 'Fatal', text: 'Tidak ada cache offline. Butuh internet pertama kali.' }); }
            
            if(!config.playlist) config.playlist = [{type: config.mediaType || 'youtube', url: config.mediaSource || 'aqz-KE-bpKQ', duration: 30}];
            if(typeof config.counters[0] === 'string') config.counters = config.counters.map(c => ({name: c, role: c.toLowerCase().includes('cs') ? 'cs' : 'teller'}));
            if(config.videoVolume === undefined) config.videoVolume = 50; if(config.voiceVolume === undefined) config.voiceVolume = 100;
            if(!config.kioskBgImage) config.kioskBgImage = "https://images.unsplash.com/photo-1554224155-8d04cb21cd6c?auto=format&fit=crop&q=80";
            if(!config.kioskRunningText) config.kioskRunningText = "Selamat Datang di Kiosk Bankaltimtara - Pilih Layanan Anda";

            updateBrand(); renderView(); setInterval(updateClock, 1000);
            if(view === 'display') fetchWeather();
        }

        function updateClock() { const el = document.getElementById('clock'); if(el) el.innerText = new Date().toLocaleTimeString('id-ID'); }
        function updateBrand() {
            document.documentElement.style.setProperty('--p-color', config.primaryColor); document.documentElement.style.setProperty('--s-color', config.secondaryColor); document.documentElement.style.setProperty('--printer-width', config.printerSize);
            const imgL = document.getElementById('nav-logo'); if(config.bankLogo) imgL.src = config.bankLogo; else imgL.classList.add('hidden');
            document.getElementById('nav-bank-name').innerText = config.bankName; 
            const badge = document.getElementById('role-badge'); if(view !== 'display' && view !== 'kiosk') { badge.classList.remove('hidden'); badge.innerText = view === 'staff' ? params.get('name').toUpperCase() : view.toUpperCase(); }
        }

        function renderView() {
            const el = document.getElementById('app-container');
            if(view === 'kiosk') { renderKiosk(el); setInterval(pollKiosk, 5000); }
            else if(view === 'display') { renderDisplay(el); }
            else if(view === 'staff') { renderStaff(el); }
            else if(view === 'admin') renderAdmin(el);
        }

        // ==========================================
        // 1. KIOSK NASABAH (With Dynamic Ambiance)
        // ==========================================
        function renderKiosk(el) {
            document.getElementById('top-nav').style.display = 'none';
            let bgHTML = ""; let cardClass = ""; let titleColor = "text-white";
            
            // DYNAMIC TIME AMBIANCE
            const hour = new Date().getHours();
            let timeGreeting = "SELAMAT DATANG"; let timeBg = "";
            if(config.kioskTheme === 'default') {
                if(hour >= 5 && hour < 11) { timeGreeting = "SELAMAT PAGI"; timeBg = "linear-gradient(135deg, #FF9A9E 0%, #FECFEF 99%, #FECFEF 100%)"; }
                else if(hour >= 11 && hour < 15) { timeGreeting = "SELAMAT SIANG"; timeBg = "linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%)"; }
                else if(hour >= 15 && hour < 18) { timeGreeting = "SELAMAT SORE"; timeBg = "linear-gradient(135deg, #ff9a44 0%, #fc6076 100%)"; }
                else { timeGreeting = "SELAMAT MALAM"; timeBg = "linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%)"; titleColor = "text-white"; }
            } else { timeGreeting = config.kioskWelcomeTitle; }
            
            if(config.kioskTheme === 'minimalist') {
                bgHTML = `<div class="absolute inset-0 bg-white z-0" style="background-image: url('${config.kioskBgImage}'); background-size: cover; background-position: center; opacity: 0.1;"></div>`;
                cardClass = "bg-white p-8 rounded-[2rem] shadow-xl border border-slate-200 mt-16 text-center"; titleColor = "text-slate-800";
            } else if (config.kioskTheme === 'vibrant') {
                bgHTML = `<div class="absolute inset-0 bg-gradient-to-br from-indigo-600 via-primary to-secondary z-0 animate-gradient-x" style="background-image: url('${config.kioskBgImage}'); background-blend-mode: overlay; background-size: cover; background-position: center; opacity: 0.9;"></div>`;
                cardClass = "bg-white/20 backdrop-blur-lg p-8 rounded-[2rem] shadow-2xl border border-white/40 mt-16 text-center";
            } else {
                bgHTML = `<div class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm z-0" style="background: ${timeBg}"></div><div class="orb bg-primary" style="width: 600px; height: 600px; top: -100px; left: -100px; animation-duration: 12s;"></div><div class="orb bg-secondary" style="width: 500px; height: 500px; bottom: -100px; right: -50px; animation-duration: 15s; animation-delay: 2s;"></div>`;
                cardClass = "bg-white/10 backdrop-blur-md p-8 rounded-[2.5rem] shadow-2xl border border-white/30 border-t-8 border-t-secondary mt-16 text-center z-10";
            }

            el.innerHTML = `
                <div id="kiosk-ui" class="h-full flex-col relative flex overflow-hidden ${config.kioskTheme==='minimalist'?'bg-white':'bg-slate-900'}" style="background-image: url('${config.kioskTheme!=='vibrant'?config.kioskBgImage:''}'); background-size: cover; background-position: center;">
                    ${bgHTML}
                    <div id="power-screen" class="absolute inset-0 z-50 flex flex-col items-center justify-center bg-slate-900/95 backdrop-blur-md transition-opacity duration-500">
                        <button onclick="startSystem()" class="flex flex-col items-center focus:outline-none hover:scale-110 transition-transform btn-hover-fx rounded-3xl p-10">
                            <lord-icon src="https://cdn.lordicon.com/ajkxzzpl.json" trigger="loop" colors="primary:#F37021,secondary:#F37021" style="width:150px;height:150px" class="mb-8 pulse-heartbeat"></lord-icon>
                            <h1 class="text-4xl font-black tracking-widest text-white">AKTIFKAN SISTEM</h1>
                        </button>
                    </div>

                    <div class="z-10 flex flex-col h-full w-full p-12">
                        <div class="flex justify-between items-start mb-6 border-b ${config.kioskTheme==='minimalist'?'border-slate-200':'border-white/20'} pb-8">
                            <img src="${config.bankLogo || ''}" class="h-20 ${config.kioskTheme==='minimalist'?'':'brightness-0 invert filter drop-shadow-md'}">
                            <div class="text-right ${titleColor} max-w-2xl">
                                <h1 class="text-5xl font-black uppercase tracking-widest mb-2 drop-shadow-sm">${timeGreeting}</h1>
                                <p class="text-xl opacity-80 font-medium">${config.kioskWelcomeDesc}</p>
                            </div>
                        </div>
                        
                        <div class="flex-grow flex flex-col items-center justify-center max-w-7xl mx-auto w-full gap-10">
                            <div class="w-full max-w-2xl ${cardClass} relative">
                                <div class="absolute -top-16 left-1/2 transform -translate-x-1/2" id="kiosk-cam-container">
                                    <div class="w-32 h-32 bg-slate-900 rounded-full border-[6px] border-slate-100 flex items-center justify-center shadow-xl relative overflow-hidden">
                                        <video id="hidden-cam" autoplay playsinline class="w-full h-full object-cover"></video>
                                        <div class="scanner-hud rounded-full"></div>
                                    </div>
                                </div>
                                <div class="pt-10">
                                    <label class="block mb-4 font-black ${config.kioskTheme==='minimalist'?'text-slate-500':'text-white'} text-sm uppercase tracking-widest">Detail Layanan Anda</label>
                                    <select id="spec-service" class="w-full p-5 rounded-2xl text-2xl font-bold bg-white text-slate-800 border-2 border-slate-200 outline-none cursor-pointer shadow-sm"><option>Setoran / Penarikan Tunai</option><option>Pembukaan Rekening Baru</option><option>Layanan Kredit / Pinjaman</option><option>Customer Service Umum</option></select>
                                </div>
                            </div>
                            <div class="grid grid-cols-2 gap-10 w-full max-w-5xl mt-6 z-10">
                                <button onclick="takeTicket('teller', this)" class="btn-hover-fx bg-gradient-to-br from-blue-500 to-blue-800 p-12 rounded-[3rem] text-white flex flex-col items-center justify-center shadow-[0_20px_50px_rgba(0,74,153,0.5)] border border-white/20">
                                    <lord-icon src="https://cdn.lordicon.com/qhviklyi.json" trigger="loop" colors="primary:#ffffff,secondary:#ffffff" style="width:100px;height:100px" class="mb-4 drop-shadow-lg"></lord-icon>
                                    <div class="text-4xl font-black">TELLER</div>
                                </button>
                                <button onclick="takeTicket('cs', this)" class="btn-hover-fx bg-gradient-to-br from-secondary to-orange-500 p-12 rounded-[3rem] text-white flex flex-col items-center justify-center shadow-[0_20px_50px_rgba(243,112,33,0.5)] border border-white/20">
                                    <lord-icon src="https://cdn.lordicon.com/dxjqoygy.json" trigger="loop" colors="primary:#ffffff,secondary:#ffffff" style="width:100px;height:100px" class="mb-4 drop-shadow-lg"></lord-icon>
                                    <div class="text-4xl font-black">CUSTOMER SERVICE</div>
                                </button>
                            </div>
                        </div>
                    </div>
                    
                    <div class="h-16 ${config.kioskTheme==='minimalist'?'bg-slate-100 text-slate-700':'bg-black/40 text-white'} flex items-center overflow-hidden z-20 border-t ${config.kioskTheme==='minimalist'?'border-slate-200':'border-white/10'}">
                        <div class="marquee text-2xl font-black uppercase tracking-widest drop-shadow-md">${config.kioskRunningText}</div>
                    </div>
                </div>
            `;
        }

        async function startSystem() {
            let popupLeft = window.screen.width; let popupTop = 0; let popupWidth = 1920; let popupHeight = 1080;
            if ('getScreenDetails' in window) { try { const screenDetails = await window.getScreenDetails(); const externalScreen = screenDetails.screens.find(s => s !== screenDetails.currentScreen); if (externalScreen) { popupLeft = externalScreen.left; popupTop = externalScreen.top; popupWidth = externalScreen.width; popupHeight = externalScreen.height; } } catch(e) {} }
            window.open(window.location.pathname + '?view=display', 'BankingHall', `left=${popupLeft},top=${popupTop},width=${popupWidth},height=${popupHeight}`);
            
            const pScreen = document.getElementById('power-screen'); pScreen.style.opacity = '0'; setTimeout(() => pScreen.classList.add('hidden'), 500);
            
            try { 
                const constraints = hardwareSettings.camera ? { video: { deviceId: { exact: hardwareSettings.camera } } } : { video: true };
                const stream = await navigator.mediaDevices.getUserMedia(constraints); document.getElementById('hidden-cam').srcObject = stream; 
            } catch(e) { console.log(e); Swal.fire('Informasi', 'Kamera tidak terdeteksi. Fitur foto dinonaktifkan.', 'info'); }
        }

        async function takeTicket(type, btnObj) {
            btnObj.disabled = true; 
            
            // SCI-FI SCANNER FX
            const camContainer = document.getElementById('kiosk-cam-container');
            camContainer.classList.add('scanner-active'); playSciFiScanner();
            
            setTimeout(async () => {
                const flash = document.getElementById('camera-flash'); flash.style.opacity = '1'; setTimeout(() => flash.style.opacity = '0', 100);
                camContainer.classList.remove('scanner-active');
                
                Swal.fire({ title: 'Mencetak...', allowOutsideClick: false, showConfirmButton: false, background: 'rgba(255,255,255,0.9)', didOpen: () => { Swal.showLoading() } });
                
                let photo = ""; const video = document.getElementById('hidden-cam');
                if(video && video.srcObject) { const canvas = document.createElement('canvas'); canvas.width = video.videoWidth; canvas.height = video.videoHeight; canvas.getContext('2d').drawImage(video, 0, 0); photo = canvas.toDataURL('image/jpeg', 0.5); }
                const service = document.getElementById('spec-service').value;

                if(!navigator.onLine) {
                    const ticketNo = (type === 'teller' ? 'T-O' : 'C-O') + Math.floor(Math.random()*1000);
                    offlineQueue.push({ type, photo, service, timestamp: new Date().getTime(), ticket: ticketNo });
                    localStorage.setItem('offlineQueue', JSON.stringify(offlineQueue));
                    printResi(ticketNo, service); btnObj.disabled = false; return;
                }

                try {
                    const data = await fetchPost({ action: 'generate', type, photo, service });
                    if(data.success) { config.receiptTheme = data.receiptTheme; printResi(data.ticket, service); }
                } catch (e) { Swal.fire('Gagal', 'Koneksi ke server terputus.', 'error'); }
                finally { btnObj.disabled = false; }
            }, 1200);
        }

        async function printResi(ticketNo, service) {
            Swal.close(); Swal.fire({ icon: 'success', title: 'Silahkan Ambil Resi', text: `Nomor Antrian: ${ticketNo}`, timer: 2000, showConfirmButton: false });
            const pArea = document.getElementById('print-area'); pArea.className = "hidden flex flex-col mx-auto text-black theme-" + config.receiptTheme;
            document.getElementById('p-header').innerText = config.receiptTemplate.header; document.getElementById('p-footer').innerText = config.receiptTemplate.footer; document.getElementById('p-disclaimer').innerText = config.receiptTemplate.disclaimer;
            document.getElementById('p-ticket').innerText = ticketNo; document.getElementById('p-service').innerText = "Layanan: " + service; document.getElementById('p-date').innerText = new Date().toLocaleString('id-ID');
            
            if(hardwareSettings.printer) {
                try {
                    const devices = await navigator.usb.getDevices();
                    const printer = devices.find(d => d.serialNumber === hardwareSettings.printer || d.productName === hardwareSettings.printer);
                    if(printer) {
                        await printer.open(); await printer.selectConfiguration(1); await printer.claimInterface(0);
                        const encoder = new TextEncoder();
                        const data = encoder.encode(`\x1B\x40${config.receiptTemplate.header}\nLayanan: ${service}\n\x1B\x21\x30${ticketNo}\x1B\x21\x00\n${new Date().toLocaleString('id-ID')}\n${config.receiptTemplate.footer}\n${config.receiptTemplate.disclaimer}\n\n\n\n`);
                        await printer.transferOut(1, data); await printer.close(); return; 
                    }
                } catch(e) {} 
            }
            pArea.classList.remove('hidden'); window.print(); pArea.classList.add('hidden');
        }

            if(media.type === 'youtube') {
                container.innerHTML = `<div id="yt-player" class="w-full h-full pointer-events-none"></div>`;
                if(window.YT && window.YT.Player) {
                    ytPlayer = new YT.Player('yt-player', { videoId: media.url, playerVars: { 'autoplay': 1, 'controls': 0, 'disablekb': 1, 'modestbranding': 1, 'rel': 0 }, events: { 'onReady': function(event) { event.target.setVolume(Number(config.videoVolume) || 50); event.target.playVideo(); } } });
                }
            } else if (media.type === 'local') {
                container.innerHTML = `<video class="w-full h-full object-cover" src="${media.url}" autoplay loop muted></video>`;
                const vid = container.querySelector('video'); if(vid) { vid.muted = false; vid.volume = (Number(config.videoVolume) || 50) / 100; }
            } else {
                container.innerHTML = `<img src="${media.url}" class="w-full h-full object-cover transition-opacity duration-1000 animate-fadeIn">`;
            }

            playlistIndex = (playlistIndex + 1) % config.playlist.length;
            if(playlistTimer) clearTimeout(playlistTimer);
            playlistTimer = setTimeout(playMediaPlaylist, (media.duration || 30) * 1000);
        }

        async function pollDisplay() {
            if(!navigator.onLine) return; 
            try {
                const state = await fetchAPI('getState');
                checkConfigUpdate(state.configUpdated);

                const nextTeller = state.teller.lastGenerated > state.teller.currentCalled ? `T-${state.teller.currentCalled + 1}` : '-';
                const nextCS = state.cs.lastGenerated > state.cs.currentCalled ? `C-${state.cs.currentCalled + 1}` : '-';
                const ntEl = document.getElementById('d-next-teller'); if(ntEl) ntEl.innerText = nextTeller;
                const ncEl = document.getElementById('d-next-cs'); if(ncEl) ncEl.innerText = nextCS;

                if(state.activeCounters) {
                    config.counters.forEach(c => {
                        const elGrid = document.getElementById(`grid-${c.name.replace(/\s+/g, '-')}`); const elBox = document.getElementById(`box-${c.name.replace(/\s+/g, '-')}`); const elIcon = document.getElementById(`icon-break-${c.name.replace(/\s+/g, '-')}`);
                        if(elGrid && elGrid.innerText !== (state.activeCounters[c.name] || "-")) { elGrid.innerText = state.activeCounters[c.name] || "-"; elGrid.classList.add('scale-125', 'text-yellow-300'); setTimeout(() => elGrid.classList.remove('scale-125', 'text-yellow-300'), 500); }
                        if(state.counterStatus && (state.counterStatus[c.name] === 'break' || state.counterStatus[c.name] === 'offline')) { elBox.classList.add('counter-offline'); elGrid.innerText = "TUTUP"; elIcon.classList.remove('hidden'); } else { elBox.classList.remove('counter-offline'); elIcon.classList.add('hidden'); }
                    });
                }
                
                const now = state.lastCalled;
                if(now.timestamp && now.timestamp !== lastCallTimestamp && now.ticket !== "-") {
                    if(lastCallTimestamp !== 0) { 
                        recentCalls.unshift({ ticket: document.getElementById('d-ticket').innerText, counter: document.getElementById('d-counter').innerText }); 
                        if(recentCalls.length > 3) recentCalls.pop(); 
                        const rcContainer = document.getElementById('recent-calls-list');
                        if(rcContainer) rcContainer.innerHTML = recentCalls.map(rc => `<div class="bg-slate-50 border border-slate-100 rounded-xl p-3 flex justify-between items-center shadow-sm slide-in-right"><div class="font-black text-slate-700 text-xl">${rc.ticket}</div><div class="text-[10px] font-bold bg-slate-200 text-slate-600 px-3 py-1 rounded-full uppercase">${rc.counter}</div></div>`).join('');
                    }
                    
                    const tktEl = document.getElementById('d-ticket'); tktEl.innerText = now.ticket; document.getElementById('d-counter').innerText = now.counter;
                    const stEl = document.getElementById('d-status-text'); if(stEl) stEl.innerHTML = `Nomor <span class="text-primary font-black">${now.ticket}</span> dilayani di <span class="text-primary font-black">${now.counter}</span>`;
                    
                    // SONIC RIPPLE RADAR
                    const avaCont = document.getElementById('d-avatar-container');
                    tktEl.classList.add('pulse-heartbeat', 'text-secondary'); avaCont.classList.add('pulse-heartbeat', 'border-secondary', 'ripple-fx'); document.getElementById('d-counter-box').classList.add('bg-secondary');
                    setTimeout(() => { tktEl.classList.remove('pulse-heartbeat', 'text-secondary'); avaCont.classList.remove('pulse-heartbeat', 'border-secondary', 'ripple-fx'); document.getElementById('d-counter-box').classList.remove('bg-secondary'); }, 2500);
                    
                    const imgEl = document.getElementById('d-img'); const iconEl = document.getElementById('d-icon');
                    if(imgEl && now.photo && now.photo.startsWith('data:')) { imgEl.src = now.photo; imgEl.classList.remove('hidden'); iconEl.classList.add('hidden'); } else { imgEl.classList.add('hidden'); iconEl.classList.remove('hidden'); }
                    
                    try {
                        if(ytPlayer && ytPlayer.setVolume) ytPlayer.setVolume(10);
                        await playChime(); 
                        const msg = new SpeechSynthesisUtterance(`Nomor antrian, ${now.ticket.replace('-', ' ')}, silahkan menuju, ${now.counter}`); 
                        msg.lang = 'id-ID'; msg.pitch = config.voiceConfig.pitch; msg.rate = config.voiceConfig.rate; msg.volume = (Number(config.voiceVolume)||100) / 100;
                        if(config.voiceConfig.voiceURI && voices.length > 0) { const v = voices.find(v => v.voiceURI === config.voiceConfig.voiceURI); if(v) msg.voice = v; }
                        msg.onend = function() { if(ytPlayer && ytPlayer.setVolume) ytPlayer.setVolume(Number(config.videoVolume) || 50); };
                        speechSynthesis.speak(msg); 
                    } catch(e) {}
                    
                    lastCallTimestamp = now.timestamp;
                }
            } catch(e){}
        }

            document.addEventListener('keydown', function(e) {

        function toggleStaffUI() {
            const idle = document.getElementById('staff-idle'); const active = document.getElementById('staff-active');
            if(!lastCalled || lastCalled === "-") { idle.classList.remove('hidden'); active.classList.add('hidden'); } 
            else { idle.classList.add('hidden'); active.classList.remove('hidden'); active.classList.add('flex'); }
        }

        async function changeStaffStatus(counterName) { const status = document.getElementById('staff-status').value; try { await fetchPost({ action: 'updateStatus', counterName, status }); Toast.fire({ icon: 'success', title: `Status Loket diubah.` }); } catch(e){} }
        
        async function transferQueue(counterName) {
            if(!lastCalled || lastCalled === "-") return Toast.fire({ icon: 'warning', title: 'Belum ada tiket aktif.' });
            const target = await Swal.fire({ title: 'Transfer Antrian', text: `Pindahkan tiket ${lastCalled} ke loket mana?`, input: 'select', inputOptions: { 'teller': 'Antrian TELLER', 'cs': 'Antrian CUSTOMER SERVICE' }, showCancelButton: true, confirmButtonText: 'Transfer Sekarang' });
            if(target.isConfirmed) { Swal.fire({ title: 'Memproses Transfer...', allowOutsideClick: false, didOpen: () => { Swal.showLoading() } }); try { const data = await fetchPost({ action: 'transfer', targetType: target.value, photo: lastPhoto, service: lastService }); if(data.success) { Swal.fire('Berhasil Transfer', `Tiket baru: ${data.newTicket}. Silahkan catat di resi.`, 'success'); resetStaffUI(); } } catch(e) { Swal.fire('Error', 'Gagal transfer antrian', 'error'); } }
        }
        
        async function staffAction(action, type, counterName, btnElement) {
            if(action === 'recall' && (!lastCalled || lastCalled === "-")) return Toast.fire({ icon: 'info', title: 'Belum ada nasabah.' });
            let origHTML = ""; if (btnElement) { origHTML = btnElement.innerHTML; btnElement.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Memproses...`; btnElement.disabled = true; }
            try { 
                const safeType = String(type).toLowerCase();
                const data = await fetchPost({ action, type: safeType, counterName, lastTicket: lastCalled }); 
                if(data.success) { 
                    lastCalled = data.ticket; lastPhoto = data.photo || ""; lastService = data.service || "Umum"; 
                    toggleStaffUI();
                    const tktEl = document.getElementById('s-ticket'); tktEl.innerText = data.ticket; tktEl.classList.add('scale-110'); setTimeout(() => tktEl.classList.remove('scale-110'), 300);
                    document.getElementById('s-service').innerText = data.service; 
                    if(data.photo && data.photo.startsWith('data:')) document.getElementById('s-photo').innerHTML = `<img src="${data.photo}" class="w-full h-full object-cover">`; else document.getElementById('s-photo').innerHTML = `<i class="fa-solid fa-user-astronaut text-[100px] opacity-30"></i>`; 
                    Toast.fire({ icon: 'success', title: `Antrian dipanggil.` }); pollStaffStatus(safeType, counterName); 
                } else { Swal.fire('Info', data.msg, 'info'); } 
            } catch(e) { console.error(e); Toast.fire({ icon: 'error', title: 'Gagal koneksi ke server.' }); }
            finally { if (btnElement) { btnElement.innerHTML = origHTML; btnElement.disabled = false; } }
        }

        function markDone() { 
            if(!lastCalled || lastCalled === "-") return; 
            confetti({ particleCount: 150, spread: 80, origin: { y: 0.6 }, colors: [config.primaryColor, config.secondaryColor, '#10B981'] }); 
            resetStaffUI(); 
            Toast.fire({ icon: 'success', title: 'Transaksi Selesai.' }); 
        }
        function resetStaffUI() { lastCalled = ""; lastPhoto = ""; lastService = ""; toggleStaffUI(); }
        
        async function pollStaffStatus(role, counterName) { 
            try { 
                const state = await fetchAPI('getState'); checkConfigUpdate(state.configUpdated); const rData = state[role] || {lastGenerated:0, currentCalled:0}; 
                
                if(!lastCalled && state.activeCounters && state.activeCounters[counterName] && state.activeCounters[counterName] !== "-") { lastCalled = state.activeCounters[counterName]; toggleStaffUI(); document.getElementById('s-ticket').innerText = lastCalled; }
                document.getElementById('st-prev').innerText = rData.currentCalled > 1 ? (role==='teller'?'T-':'C-') + (rData.currentCalled - 1) : '-'; 
                
                // SLA Color Morphing Indicator
                const sisa = rData.lastGenerated - rData.currentCalled; 
                const nextEl = document.getElementById('st-next'); const stBox = document.getElementById('st-box');
                
                if(sisa > 6) { 
                    stBox.className = "flex gap-8 text-right bg-red-500/90 text-white p-4 rounded-2xl shadow-[0_0_20px_rgba(239,68,68,0.6)] pulse-heartbeat transition-all duration-1000"; 
                    nextEl.className = "text-2xl font-black text-white"; 
                } else if(sisa > 3) { 
                    stBox.className = "flex gap-8 text-right bg-yellow-400 text-slate-900 p-4 rounded-2xl shadow-[0_0_15px_rgba(250,204,21,0.5)] transition-all duration-1000"; 
                    nextEl.className = "text-2xl font-black text-slate-900"; 
                } else { 
                    const innerClass = config.counterTheme === 'light' ? 'bg-slate-50' : 'bg-black/20';
                    stBox.className = `flex gap-8 text-right ${innerClass} p-4 rounded-2xl border border-white/10 transition-all duration-1000`; 
                    nextEl.className = "text-2xl font-black text-secondary transition-all duration-300"; 
                }
                nextEl.innerText = sisa > 0 ? `${sisa} Orang` : 'KOSONG';
            } catch(e){} 
        }

        function selectTheme(category, themeName) { document.getElementById(`f-${category.charAt(0)}theme`).value = themeName; document.querySelectorAll(`.theme-card-${category}`).forEach(el => el.classList.remove('border-primary', 'bg-blue-50', 'ring-4', 'ring-primary/20')); const selectedCard = document.getElementById(`theme-${category}-${themeName}`); if(selectedCard) selectedCard.classList.add('border-primary', 'bg-blue-50', 'ring-4', 'ring-primary/20'); }

        function updateLiveReceipt() { document.getElementById('prev-header').innerText = document.getElementById('f-cheader').value; document.getElementById('prev-footer').innerText = document.getElementById('f-cfooter').value; document.getElementById('prev-disc').innerText = document.getElementById('f-cdisc').value; }

        let dragSrcEl = null;
        function dragStartPL(e, i) { dragSrcEl = i; e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/html', e.target.innerHTML); e.target.classList.add('dragging'); }
        function dragOverPL(e) { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; e.currentTarget.classList.add('drag-over'); return false; }
        function dragLeavePL(e) { e.currentTarget.classList.remove('drag-over'); }
        function dropPL(e, i) { e.stopPropagation(); e.currentTarget.classList.remove('drag-over'); if (dragSrcEl !== i) { const item = config.playlist.splice(dragSrcEl, 1)[0]; config.playlist.splice(i, 0, item); renderPlaylistGUI(); } return false; }

        function renderPlaylistGUI() {
            const container = document.getElementById('playlist-container'); if(!container) return;
            container.innerHTML = config.playlist.map((m, i) => `
                <div draggable="true" ondragstart="dragStartPL(event, ${i})" ondragover="dragOverPL(event)" ondragleave="dragLeavePL(event)" ondrop="dropPL(event, ${i})" ondragend="this.classList.remove('dragging')" class="flex items-center gap-2 p-3 bg-slate-50 border border-slate-200 rounded-xl cursor-move hover:bg-slate-100 transition-colors" id="plRow_${i}">
                    <i class="fa-solid fa-grip-vertical text-slate-400 cursor-grab px-2"></i>

                    <input type="text" id="plUrl_${i}" value="${m.url}" placeholder="URL Gambar / ID Youtube" class="flex-grow p-2 border rounded-lg text-xs outline-none font-mono pointer-events-auto">
                    <input type="file" id="plFile_${i}" accept="image/*,video/*" class="hidden" onchange="uploadMedia(this, 'plUrl_${i}')">
                    <button onclick="document.getElementById('plFile_${i}').click()" title="Upload File" class="bg-slate-200 text-slate-700 px-3 py-2 rounded-lg text-xs hover:bg-slate-300 pointer-events-auto"><i class="fa-solid fa-upload"></i></button>
                    <div class="flex items-center gap-1 w-24 bg-white border rounded-lg p-1 pointer-events-auto"><input type="number" id="plDur_${i}" value="${m.duration}" class="w-full text-center text-xs font-bold outline-none"><span class="text-[10px] text-slate-400 pr-1">dtk</span></div>
                    <button onclick="config.playlist.splice(${i}, 1); renderPlaylistGUI();" class="text-red-500 px-2 hover:text-red-700 pointer-events-auto"><i class="fa-solid fa-xmark"></i></button>
                </div>
            `).join('');
        }
        function addPlaylistRow() { if(config.playlist.length >= 10) return Swal.fire('Batas Penuh','Maksimal 10 media.','warning'); config.playlist.push({type:'image', url:'', duration:15}); renderPlaylistGUI(); }

        async function scanUSB() {
            try { const device = await navigator.usb.requestDevice({ filters: [] }); hardwareSettings.printer = device.serialNumber || device.productName; hardwareSettings.printerName = device.productName || 'Thermal USB'; localStorage.setItem('hardwareSettings', JSON.stringify(hardwareSettings)); document.getElementById('usb-status').innerHTML = `<span class="text-green-600 font-bold"><i class="fa-solid fa-check mr-2"></i> ${hardwareSettings.printerName}</span>`; } 
            catch(e) { document.getElementById('usb-status').innerHTML = `<span class="text-red-500">Izin USB dibatalkan.</span>`; }
        }
        async function scanCameras(silent = false) {
            try { await navigator.mediaDevices.getUserMedia({video: true}); const devices = await navigator.mediaDevices.enumerateDevices(); const videoInputs = devices.filter(d => d.kind === 'videoinput'); const select = document.getElementById('f-camera'); if(!select) return; select.innerHTML = '<option value="">-- Gunakan Kamera Default --</option>' + videoInputs.map(cam => `<option value="${cam.deviceId}" ${hardwareSettings.camera === cam.deviceId ? 'selected' : ''}>${cam.label || 'Kamera ' + cam.deviceId.substring(0,5)}</option>`).join(''); select.onchange = (e) => { hardwareSettings.camera = e.target.value; localStorage.setItem('hardwareSettings', JSON.stringify(hardwareSettings)); Toast.fire({icon:'success',title:'Kamera disimpan'}); }; if(!silent) Toast.fire({icon:'success',title:'Deteksi Selesai'}); } 
            catch(e){ if(!silent) Swal.fire('Error','Izin kamera ditolak browser.','error'); }
        }

        function populateVoiceSelect() { const select = document.getElementById('f-voice'); if(!select) return; select.innerHTML = voices.map(v => `<option value="${v.voiceURI}" ${config.voiceConfig.voiceURI === v.voiceURI ? 'selected' : ''}>${v.name} (${v.lang})</option>`).join(''); }
        function testVoice() { const msg = new SpeechSynthesisUtterance("Nomor Antrian, T 1, Silahkan Menuju, Teller 1"); const vURI = document.getElementById('f-voice').value; const v = voices.find(vo => vo.voiceURI === vURI); if(v) msg.voice = v; msg.pitch = parseFloat(document.getElementById('f-pitch').value); msg.rate = parseFloat(document.getElementById('f-rate').value); msg.volume = (parseFloat(document.getElementById('f-svol').value)||100)/100; msg.lang = 'id-ID'; speechSynthesis.speak(msg); }
        function addRate() { const i = document.querySelectorAll('[id^="rname_"]').length; const html = `<div class="flex gap-2 mb-2 items-center" id="rateRow_${i}"><input type="text" id="rname_${i}" placeholder="Nama Info" class="w-1/2 p-2 bg-slate-50 border rounded font-bold text-sm"><input type="text" id="rval_${i}" placeholder="Nilai" class="w-1/2 p-2 bg-slate-50 border rounded text-sm text-primary font-black"><button onclick="document.getElementById('rateRow_${i}').remove()" class="text-red-500 hover:text-red-700 px-2"><i class="fa-solid fa-trash"></i></button></div>`; document.getElementById('rates-container').insertAdjacentHTML('beforeend', html); }

        function uploadMedia(input, targetId) {
            const file = input.files[0]; if(!file) return;
            Swal.fire({ title: 'Mengunggah ke Drive...', text: 'Mohon tunggu...', allowOutsideClick: false, didOpen: () => { Swal.showLoading() } });
            const reader = new FileReader();
            reader.onload = async function(e) {
                const base64 = e.target.result.split(',')[1];
                try {
                    const data = await fetchPost({ action: 'uploadMedia', filename: file.name, mimeType: file.type, base64: base64 });
                    if(data.success) { document.getElementById(targetId).value = data.url; Swal.fire('Berhasil', 'File tersimpan di Google Drive.', 'success'); } 
                    else Swal.fire('Gagal', data.msg, 'error');
                } catch(err) { Swal.fire('Error', 'Gagal upload. Periksa Izin Script.', 'error'); }
            }; reader.readAsDataURL(file);
        }

        function renderCounterManagerGUI() {
            const baseUrl = window.location.origin + window.location.pathname; const container = document.getElementById('counter-manager-list'); if(!container) return; 
            config.counters = config.counters.filter(c => c.name && c.name.trim() !== '');
            container.innerHTML = config.counters.map((c, idx) => {

                return `<div class="flex items-center gap-3 bg-white p-3 rounded-xl border border-slate-200 shadow-sm"><div class="font-black text-slate-700 w-48 truncate uppercase text-sm flex items-center gap-2"><i class="fa-solid ${c.role==='teller'?'fa-vault text-blue-500':'fa-user-tie text-orange-500'}"></i> ${c.name}</div><div class="bg-slate-100 text-[10px] font-bold px-2 py-1 rounded text-slate-500 uppercase">${c.role}</div><input type="text" readonly value="${link}" class="flex-grow text-[11px] p-2 bg-slate-50 border border-slate-100 rounded outline-none text-slate-500 font-mono"><button onclick="navigator.clipboard.writeText('${link}').then(()=>Toast.fire({icon:'success',title:'URL Link dicopy!'}))" class="bg-slate-800 text-white px-4 py-2 rounded font-bold text-xs hover:bg-black transition-colors" title="Copy Link URL"><i class="fa-solid fa-copy"></i> Copy</button><button onclick="config.counters.splice(${idx}, 1); renderCounterManagerGUI();" class="bg-red-50 text-red-500 px-4 py-2 rounded font-bold text-xs hover:bg-red-100 transition-colors"><i class="fa-solid fa-trash"></i></button></div>`; 
            }).join('');

        function addCounterGUI() { const name = document.getElementById('new-counter-name').value.trim(); const role = document.getElementById('new-counter-role').value; if(name) { config.counters.push({name, role}); renderCounterManagerGUI(); document.getElementById('new-counter-name').value = ''; } }

        async function loadAdminReports() { try { const res = await fetchAPI('getReports'); rawReportData = await res.json(); const today = new Date().toLocaleDateString('en-CA', {timeZone: 'Asia/Makassar'}); document.getElementById('filter-start').value = today; document.getElementById('filter-end').value = today; applyReportFilter(); } catch(e){} }
        function applyReportFilter() { const start = new Date(document.getElementById('filter-start').value); start.setHours(0,0,0,0); const end = new Date(document.getElementById('filter-end').value); end.setHours(23,59,59,999); filteredData = rawReportData.filter(row => { if(!row[0]) return false; const rDate = new Date(row[0]); return rDate >= start && rDate <= end; }); renderReportTableAndCharts(); }
        
        function renderReportTableAndCharts() {
            const tbody = document.getElementById('r-table-body'); tbody.innerHTML = ''; let staffStats = {}; let total = filteredData.length; let hourlyData = {}; let typeCount = { teller: 0, cs: 0 };
            filteredData.slice().reverse().forEach(row => {
                let staffName = row[3] || 'Belum Dipanggil'; if(row[4] === 'TRANSFERRED') staffName = 'Ditransfer'; staffStats[staffName] = (staffStats[staffName] || 0) + 1;
                if(row[2] === 'teller') typeCount.teller++; else typeCount.cs++; if(row[0]) { const hour = new Date(row[0]).getHours(); hourlyData[hour] = (hourlyData[hour] || 0) + 1; }
                const printDateStr = row[0] ? new Date(row[0]).toLocaleString('id-ID') : '-'; const callDateStr = row[7] ? new Date(row[7]).toLocaleTimeString('id-ID') : '<span class="text-slate-300 italic">Menunggu...</span>'; const photoHtml = row[5] && row[5].startsWith('data:') ? `<img src="${row[5]}" class="w-10 h-10 object-cover rounded-full border border-slate-200 mx-auto transition-transform hover:scale-150">` : '-';
                const tr = document.createElement('tr'); tr.className = "hover:bg-slate-50 transition-colors"; tr.innerHTML = `<td class="p-4 font-medium text-slate-600">${printDateStr}</td><td class="p-4 font-bold text-slate-800">${callDateStr}</td><td class="p-4"><span class="bg-${row[2]==='teller'?'blue':'orange'}-100 text-${row[2]==='teller'?'primary':'secondary'} px-3 py-1 rounded-lg font-black shadow-sm">${row[1]}</span><div class="text-[10px] mt-1 font-bold text-slate-400 uppercase tracking-widest">${row[3] || ''}</div></td><td class="p-4 font-medium text-slate-600">${row[6]}</td><td class="p-4 text-center">${photoHtml}</td>`; tbody.appendChild(tr);
            });
            let statsHtml = `<div class="bg-primary p-4 rounded-2xl shadow-md text-white transition-transform hover:-translate-y-1"><div class="text-[10px] font-bold opacity-80 uppercase tracking-widest">Total Cetak Resi</div><div class="text-4xl font-black mt-1">${total}</div></div>`;
            Object.keys(staffStats).forEach(name => { if(name !== 'Belum Dipanggil' && name !== 'Ditransfer') { statsHtml += `<div class="bg-white border border-slate-100 p-4 rounded-2xl shadow-sm transition-transform hover:-translate-y-1"><div class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">${name}</div><div class="text-3xl font-black text-slate-700 mt-1">${staffStats[name]}</div></div>`; } }); document.getElementById('dynamic-staff-stats').innerHTML = statsHtml;
            renderCharts(typeCount, hourlyData);
        }

        function renderCharts(typeCount, hourlyData) {
            const dCtx = document.getElementById('doughnutChart').getContext('2d'); if(dChartInstance) dChartInstance.destroy(); dChartInstance = new Chart(dCtx, { type: 'doughnut', data: { labels: ['Teller', 'Customer Service'], datasets: [{ data: [typeCount.teller, typeCount.cs], backgroundColor: [config.primaryColor, config.secondaryColor], borderWidth: 0 }] }, options: { responsive: true, maintainAspectRatio: false, cutout: '70%', plugins: { legend: { position: 'bottom' } } } });
            const bCtx = document.getElementById('barChart').getContext('2d'); if(bChartInstance) bChartInstance.destroy(); const labels = Array.from({length: 9}, (_, i) => `${i+8}:00`); const data = labels.map((_, i) => hourlyData[i+8] || 0); bChartInstance = new Chart(bCtx, { type: 'bar', data: { labels: labels, datasets: [{ label: 'Jumlah Antrian', data: data, backgroundColor: config.primaryColor, borderRadius: 5 }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } } } });
        }

        function exportCSV() { if(filteredData.length === 0) return Swal.fire('Kosong', 'Tidak ada data untuk diekspor.', 'info'); let csvContent = "data:text/csv;charset=utf-8,Waktu Cetak,Nomor Tiket,Tipe,Nama Loket,Status,Keperluan,Waktu Panggil\n"; filteredData.forEach(row => { csvContent += `${row[0]},${row[1]},${row[2]},${row[3]},${row[4]},"${row[6]}",${row[7]}\r\n`; }); const link = document.createElement("a"); link.setAttribute("href", encodeURI(csvContent)); link.setAttribute("download", "Laporan_Antrian_SLA.csv"); document.body.appendChild(link); link.click(); document.body.removeChild(link); }

        async function saveAdminConfig() { 
            Swal.fire({ title: 'Menyimpan...', allowOutsideClick: false, didOpen: () => { Swal.showLoading() } }); 
            let newRates = []; document.querySelectorAll('[id^="rname_"]').forEach((el) => { const valId = el.id.replace('rname_', 'rval_'); if(el.value.trim() !== '') newRates.push({ name: el.value.trim(), value: document.getElementById(valId).value.trim() }); });
            let newPlaylist = []; document.querySelectorAll('[id^="plRow_"]').forEach(el => { const id = el.id.split('_')[1]; const url = document.getElementById(`plUrl_${id}`).value.trim(); if(url !== '') newPlaylist.push({ type: document.getElementById(`plType_${id}`).value, url: url, duration: parseInt(document.getElementById(`plDur_${id}`).value) || 15 }); });
            
            const newConfig = { 
                bankName: document.getElementById('f-bname').value, bankLogo: document.getElementById('f-logo').value, primaryColor: document.getElementById('f-c1').value, secondaryColor: document.getElementById('f-c2').value, 
                kioskWelcomeTitle: document.getElementById('f-ktitle').value, kioskWelcomeDesc: document.getElementById('f-kdesc').value, kioskBgImage: document.getElementById('f-kbg').value, kioskRunningText: document.getElementById('f-krtext').value,
                runningText: document.getElementById('f-text').value, playlist: newPlaylist,
                printerSize: document.getElementById('f-psize').value, receiptTheme: document.getElementById('f-rtheme').value, receiptTemplate: { header: document.getElementById('f-cheader').value, footer: document.getElementById('f-cfooter').value, disclaimer: document.getElementById('f-cdisc').value }, 
                counters: config.counters, rates: newRates, kioskTheme: document.getElementById('f-ktheme').value, displayTheme: document.getElementById('f-dtheme').value, counterTheme: document.getElementById('f-ctheme').value,
                videoVolume: parseInt(document.getElementById('f-vvol').value) || 50, voiceVolume: parseInt(document.getElementById('f-svol').value) || 100,
                voiceConfig: { voiceURI: document.getElementById('f-voice')?.value || "", pitch: document.getElementById('f-pitch')?.value || 1, rate: document.getElementById('f-rate')?.value || 0.85 },
                weatherLocation: config.weatherLocation || {lat: -1.2691, lon: 116.8252}
            }; 
            try { 
                const data = await fetchPost({ action: 'updateConfig', config: newConfig }); 
                if(data.success) { Swal.fire('Berhasil!', 'Perubahan otomatis disinkronisasi ke seluruh PC.', 'success'); } 
            } catch(e) { Swal.fire('Error', 'Gagal menyimpan.', 'error'); } 
        }
        
        async function resetQueue() { 
            const result = await Swal.fire({ title: 'Reset Antrian?', text: "Hanya gunakan jika Auto-Reset malam hari gagal.", icon: 'warning', showCancelButton: true, confirmButtonColor: '#d33', confirmButtonText: 'Reset Manual' }); 
            if (result.isConfirmed) { 
                Swal.fire({ title: 'Mereset...', allowOutsideClick: false, didOpen: () => { Swal.showLoading() } }); 
                const data = await fetchPost({ action: 'resetQueue' }); 
                if(data.success) Swal.fire('Selesai!', 'Antrian kembali ke 0.', 'success'); 
            } 
        }
        
        init();
    </script>
</body>
