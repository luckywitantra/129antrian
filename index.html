<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Antrian Enterprise</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Urbanist:wght@400;600;800;900&display=swap');
        :root { --p-color: #004A99; --s-color: #F37021; }
        body { font-family: 'Urbanist', sans-serif; transition: all 0.3s ease; }
        .bg-primary { background-color: var(--p-color); }
        .bg-secondary { background-color: var(--s-color); }
        .text-primary { color: var(--p-color); }
        .text-secondary { color: var(--s-color); }
        .border-primary { border-color: var(--p-color); }
        .border-secondary { border-color: var(--s-color); }
        .marquee { white-space: nowrap; animation: scroll 25s linear infinite; }
        @keyframes scroll { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }
        
        /* Printer Thermal 58mm / 80mm Formatting */
        @media print {
            body * { visibility: hidden; }
            #print-area, #print-area * { visibility: visible; }
            #print-area { position: absolute; left: 0; top: 0; width: 100%; margin: 0; padding: 0; text-align: center; font-family: 'Courier New', Courier, monospace; color: black; }
            nav, .marquee { display: none !important; }
        }
    </style>
</head>
<body class="h-screen flex flex-col bg-slate-50 overflow-hidden">

    <nav class="bg-primary text-white p-4 flex justify-between items-center shadow-xl z-50">
        <div class="flex items-center gap-3">
            <i class="fa-solid fa-building-columns text-2xl text-secondary"></i>
            <span id="nav-bank-name" class="font-black text-xl uppercase tracking-tighter">Memuat...</span>
        </div>
        <div id="clock" class="text-xl font-mono bg-black/20 px-4 py-1 rounded font-bold">00:00:00</div>
    </nav>

    <main id="app-container" class="flex-grow overflow-auto relative"></main>

    <!-- Area Cetak Thermal Tersembunyi -->
    <div id="print-area" class="hidden flex flex-col items-center py-4 w-[58mm] mx-auto text-black bg-white">
        <div id="p-header" class="text-sm font-bold whitespace-pre-line text-center border-b-2 border-dashed border-black pb-2 mb-2 w-full"></div>
        <div class="text-[10px] mt-2" id="p-service"></div>
        <h1 id="p-ticket" class="text-5xl font-black my-2"></h1>
        <div id="p-date" class="text-[10px] mb-2 border-b-2 border-dashed border-black pb-2 w-full"></div>
        <div id="p-footer" class="text-xs font-bold whitespace-pre-line text-center w-full"></div>
    </div>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbxDAZvMYENw9JWkoMcISQSD0cXZU3VCGaiqBURhIBS6ld8ei58WlyCHDRrh0ZgI0-P-fw/exec'; 
        const params = new URLSearchParams(window.location.search);
        const view = params.get('view') || 'kiosk';
        let config = {};

        async function init() {
            try {
                const res = await fetch(`${API_URL}?action=getConfig`);
                config = await res.json();
                updateBrand();
                renderView();
                setInterval(updateClock, 1000);
            } catch (e) { document.getElementById('app-container').innerHTML = `<h1 class="text-center mt-20 text-red-500 font-bold">Gagal Terhubung ke Server</h1>`; }
        }

        function updateClock() {
            const el = document.getElementById('clock');
            if(el) el.innerText = new Date().toLocaleTimeString('id-ID');
        }

        function updateBrand() {
            document.documentElement.style.setProperty('--p-color', config.primaryColor);
            document.documentElement.style.setProperty('--s-color', config.secondaryColor);
            const el = document.getElementById('nav-bank-name');
            if(el) el.innerText = config.bankName;
        }

        function renderView() {
            const el = document.getElementById('app-container');
            if(view === 'kiosk') renderKioskInit(el);
            else if(view === 'display') renderDisplay(el);
            else if(view === 'staff') renderStaff(el);
            else if(view === 'admin') renderAdmin(el);
        }

        // --- 1. VIEW KIOSK & AUTO-OPEN DISPLAY ---
        function renderKioskInit(el) {
            el.innerHTML = `
                <div class="h-full flex flex-col items-center justify-center bg-slate-800 text-white p-10 text-center z-50 absolute inset-0">
                    <i class="fa-solid fa-power-off text-9xl text-secondary mb-8 animate-pulse cursor-pointer hover:scale-110 transition" onclick="startSystem()"></i>
                    <h1 class="text-4xl font-black">SISTEM ANTRIAN SIAP</h1>
                    <p class="mt-4 text-slate-400">Klik tombol di atas untuk menyalakan Kamera dan Monitor Banking Hall</p>
                </div>
            `;
        }

        async function startSystem() {
            // Membuka layar monitor kedua secara otomatis
            window.open(window.location.pathname + '?view=display', 'BankingHallMonitor', 'width=1280,height=720');
            
            const el = document.getElementById('app-container');
            el.innerHTML = `
                <div class="h-full flex flex-col items-center justify-center p-10 text-center gap-6">
                    <div class="relative">
                        <video id="cam" autoplay class="w-64 h-64 rounded-full border-8 border-primary object-cover shadow-2xl bg-slate-200"></video>
                        <div class="absolute -bottom-4 left-1/2 transform -translate-x-1/2 bg-secondary text-white px-4 py-1 rounded-full font-bold text-sm shadow-lg whitespace-nowrap">KAMERA AKTIF</div>
                    </div>
                    <h1 class="text-5xl font-black text-slate-800 tracking-tight">PILIH LAYANAN</h1>
                    <div id="service-select" class="bg-white p-4 rounded-xl shadow-md border border-slate-200 w-full max-w-lg mb-4">
                        <p class="mb-2 font-bold text-slate-500 text-sm">Pilih Detail Keperluan Anda:</p>
                        <select id="spec-service" class="p-3 border rounded-lg w-full text-lg font-bold bg-slate-50 text-slate-800 outline-none focus:border-primary">
                            <option>Setoran / Penarikan Tunai</option>
                            <option>Pembukaan Rekening Baru</option>
                            <option>Ganti Buku / ATM</option>
                            <option>Layanan Kredit / Pinjaman</option>
                            <option>Lainnya</option>
                        </select>
                    </div>
                    <div class="grid grid-cols-2 gap-8 w-full max-w-5xl">
                        <button onclick="takeTicket('teller')" class="bg-primary p-10 rounded-[3rem] text-white cursor-pointer hover:scale-105 active:scale-95 transition shadow-2xl flex flex-col items-center">
                            <i class="fa-solid fa-vault text-8xl mb-4"></i>
                            <div class="text-4xl font-black">TELLER</div>
                        </button>
                        <button onclick="takeTicket('cs')" class="bg-secondary p-10 rounded-[3rem] text-white cursor-pointer hover:scale-105 active:scale-95 transition shadow-2xl flex flex-col items-center">
                            <i class="fa-solid fa-user-tie text-8xl mb-4"></i>
                            <div class="text-4xl font-black">CUSTOMER SERVICE</div>
                        </button>
                    </div>
                </div>
            `;
            const stream = await navigator.mediaDevices.getUserMedia({video: true});
            document.getElementById('cam').srcObject = stream;
        }

        async function takeTicket(type) {
            const video = document.getElementById('cam');
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth; canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            const photo = canvas.toDataURL('image/jpeg', 0.5);
            const service = document.getElementById('spec-service').value;

            const res = await fetch(API_URL, {
                method: 'POST',
                body: JSON.stringify({ action: 'generate', type, photo, service })
            });
            const data = await res.json();
            if(data.success) {
                // Formatting Print
                document.getElementById('p-header').innerText = data.template.header;
                document.getElementById('p-footer').innerText = data.template.footer;
                document.getElementById('p-ticket').innerText = data.ticket;
                document.getElementById('p-service').innerText = "Layanan: " + service;
                document.getElementById('p-date').innerText = new Date().toLocaleString('id-ID');
                
                document.getElementById('print-area').classList.remove('hidden');
                window.print();
                document.getElementById('print-area').classList.add('hidden');
            }
        }

        // --- 2. VIEW DISPLAY (MONITOR BANKING HALL + MULTI COUNTER STATUS) ---
        function renderDisplay(el) {
            let videoElement = config.videoType === 'local' 
                ? `<video class="w-full h-full object-cover" src="${config.videoSource}" autoplay loop muted></video>`
                : `<iframe class="w-full h-full" src="https://www.youtube.com/embed/${config.videoSource}?autoplay=1&mute=1&loop=1&playlist=${config.videoSource}" frameborder="0"></iframe>`;

            // Setup grid counter bawah secara dinamis
            let counterGridHTML = config.counters.map(c => `
                <div class="flex flex-col bg-slate-800 rounded-xl overflow-hidden border-2 border-slate-700">
                    <div class="bg-primary text-white text-center font-bold py-1 text-sm">${c}</div>
                    <div class="text-center py-2 text-3xl font-black text-secondary" id="grid-${c.replace(/\s+/g, '-')}">-</div>
                </div>
            `).join('');

            el.innerHTML = `
                <div class="flex-grow flex flex-col bg-black">
                    <div class="flex-grow grid grid-cols-12">
                        <div class="col-span-8 bg-black flex flex-col relative border-r-4 border-slate-800">
                            ${videoElement}
                            <!-- Grid Status Semua Loket di bagian bawah Video -->
                            <div class="absolute bottom-0 left-0 w-full bg-slate-900/90 backdrop-blur-sm p-4">
                                <div class="grid grid-cols-${Math.min(config.counters.length, 6)} gap-4">
                                    ${counterGridHTML}
                                </div>
                            </div>
                        </div>
                        <div class="col-span-4 bg-white flex flex-col p-8 text-center shadow-2xl z-10">
                            <h2 class="text-2xl font-black text-slate-400 mb-8 tracking-widest uppercase border-b pb-4">Panggilan Baru</h2>
                            <div class="flex-grow flex flex-col justify-center items-center">
                                <div id="d-photo" class="w-72 h-72 rounded-[40px] bg-slate-100 overflow-hidden border-8 border-primary shadow-2xl mb-8">
                                    <img src="" id="d-img" class="w-full h-full object-cover hidden">
                                    <i id="d-icon" class="fa-solid fa-user-clock text-9xl text-slate-300 mt-16"></i>
                                </div>
                                <div id="d-ticket" class="text-[150px] font-black text-primary leading-none drop-shadow-md">-</div>
                                <div id="d-counter" class="text-5xl font-black text-white bg-secondary px-10 py-3 rounded-full mt-6 shadow-xl">LOKET -</div>
                                <div id="d-service" class="text-xl font-bold text-slate-500 mt-6 bg-slate-100 px-6 py-2 rounded-xl">-</div>
                            </div>
                        </div>
                    </div>
                    <div class="h-20 bg-primary flex items-center overflow-hidden border-t-4 border-secondary">
                        <div class="marquee text-3xl text-white font-black uppercase italic tracking-wider">${config.runningText}</div>
                    </div>
                </div>
            `;
            setInterval(pollDisplay, 2500);
        }

        let lastT = "";
        async function pollDisplay() {
            const res = await fetch(`${API_URL}?action=getState`);
            const state = await res.json();
            
            // Update Grid Multi-Counter
            if(state.activeCounters) {
                config.counters.forEach(c => {
                    const el = document.getElementById(`grid-${c.replace(/\s+/g, '-')}`);
                    if(el) el.innerText = state.activeCounters[c] || "-";
                });
            }

            // Update Panggilan Utama
            const now = state.lastCalled;
            if(now.ticket !== lastT && now.ticket !== "-") {
                document.getElementById('d-ticket').innerText = now.ticket;
                document.getElementById('d-counter').innerText = now.counter;
                document.getElementById('d-service').innerText = now.service;
                if(now.photo) {
                    document.getElementById('d-img').src = now.photo;
                    document.getElementById('d-img').classList.remove('hidden');
                    document.getElementById('d-icon').classList.add('hidden');
                }
                speak(now.ticket, now.counter);
                lastT = now.ticket;
            }
        }

        function speak(t, c) {
            const msg = new SpeechSynthesisUtterance(`Nomor antrian, ${t.replace('-', ' ')}, silahkan menuju ke ${c}`);
            msg.lang = 'id-ID'; msg.rate = 0.9;
            speechSynthesis.speak(msg);
        }

        // --- 3. VIEW STAFF (TELLER / CS) ---
        function renderStaff(el) {
            const role = params.get('role') || 'teller';
            const counterName = params.get('name') || `${role.toUpperCase()} 1`; // Nama loket dari param
            
            el.innerHTML = `
                <div class="h-full flex items-center justify-center p-6 bg-slate-100">
                    <div class="bg-white p-12 rounded-[3rem] shadow-2xl w-full max-w-3xl border-t-[16px] border-primary">
                        <div class="flex justify-between items-center mb-10 pb-6 border-b">
                            <span class="bg-primary/10 text-primary px-6 py-2 rounded-xl font-black text-2xl uppercase tracking-widest">${counterName}</span>
                            <div class="text-green-500 font-black flex items-center gap-2"><div class="w-3 h-3 bg-green-500 rounded-full animate-pulse"></div> ONLINE</div>
                        </div>
                        
                        <div class="flex gap-10 mb-12">
                            <div id="s-photo" class="w-64 h-64 bg-slate-50 rounded-[2rem] border-4 border-dashed border-slate-300 flex items-center justify-center overflow-hidden shadow-inner">
                                <i class="fa-solid fa-camera text-6xl text-slate-200"></i>
                            </div>
                            <div class="flex flex-col justify-center flex-grow">
                                <div class="text-sm font-bold text-slate-400 uppercase tracking-widest mb-2">Nasabah Saat Ini</div>
                                <div id="s-ticket" class="text-8xl font-black text-slate-800 mb-2">-</div>
                                <div id="s-service" class="text-xl text-secondary font-bold bg-secondary/10 px-4 py-2 rounded-lg inline-block w-max">-</div>
                            </div>
                        </div>

                        <div class="flex flex-col gap-4">
                            <button onclick="staffAction('call', '${role}', '${counterName}')" class="w-full py-8 bg-primary text-white text-3xl font-black rounded-2xl hover:bg-blue-800 shadow-xl active:scale-95 transition-all">PANGGIL BERIKUTNYA <i class="fa-solid fa-bullhorn ml-4"></i></button>
                            <div class="grid grid-cols-2 gap-4">
                                <button onclick="staffAction('recall', '${role}', '${counterName}')" class="py-6 bg-slate-800 text-white text-xl font-bold rounded-2xl hover:bg-black transition flex items-center justify-center gap-3"><i class="fa-solid fa-rotate-right"></i> PANGGIL ULANG</button>
                                <button onclick="alert('Transaksi selesai direkam')" class="py-6 bg-green-600 text-white text-xl font-bold rounded-2xl hover:bg-green-700 transition flex items-center justify-center gap-3"><i class="fa-solid fa-check-double"></i> SELESAI</button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        let lastCalled = "";
        async function staffAction(action, type, counterName) {
            const res = await fetch(API_URL, {
                method: 'POST',
                body: JSON.stringify({ action, type, counterName, lastTicket: lastCalled })
            });
            const data = await res.json();
            if(data.success) {
                lastCalled = data.ticket;
                document.getElementById('s-ticket').innerText = data.ticket;
                if(data.photo) document.getElementById('s-photo').innerHTML = `<img src="${data.photo}" class="w-full h-full object-cover">`;
            } else { alert(data.msg || "Gagal memanggil"); }
        }

        // --- 4. VIEW ADMIN (DYNAMIC CMS & LAYOUT CONTROL) ---
        function renderAdmin(el) {
            el.innerHTML = `
                <div class="p-10 max-w-7xl mx-auto h-full flex flex-col">
                    <h1 class="text-4xl font-black mb-8 text-primary uppercase italic flex items-center gap-4"><i class="fa-solid fa-sliders"></i> Master Control Panel</h1>
                    <div class="grid grid-cols-12 gap-8 flex-grow">
                        
                        <!-- Panel CMS Kiri -->
                        <div class="col-span-5 bg-white p-8 rounded-[2rem] shadow-xl border-t-[12px] border-primary flex flex-col gap-5 overflow-auto max-h-[80vh]">
                            <h2 class="font-black text-xl border-b pb-2">PENGATURAN TAMPILAN & VIDEO</h2>
                            <div>
                                <label class="block text-xs font-bold text-slate-400 mb-1">RUNNING TEXT</label>
                                <textarea id="f-text" class="w-full p-3 border-2 rounded-xl focus:border-primary outline-none font-bold" rows="2">${config.runningText}</textarea>
                            </div>
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-xs font-bold text-slate-400 mb-1">TIPE VIDEO</label>
                                    <select id="f-vtype" class="w-full p-3 border-2 rounded-xl font-bold outline-none focus:border-primary">
                                        <option value="youtube" ${config.videoType === 'youtube' ? 'selected' : ''}>YouTube ID</option>
                                        <option value="local" ${config.videoType === 'local' ? 'selected' : ''}>Video PC Lokal</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-slate-400 mb-1">SUMBER VIDEO</label>
                                    <input id="f-vsource" class="w-full p-3 border-2 rounded-xl font-bold" value="${config.videoSource}" placeholder="ID Youtube / ./video.mp4">
                                </div>
                            </div>
                            <p class="text-[10px] text-slate-400 italic mb-4">*Untuk Video Lokal, letakkan file mp4 satu folder dengan aplikasi dan ketik <b>./namafile.mp4</b></p>
                            
                            <h2 class="font-black text-xl border-b pb-2 mt-2">MANAJEMEN LOKET & CETAKAN</h2>
                            <div>
                                <label class="block text-xs font-bold text-slate-400 mb-1">DAFTAR LOKET AKTIF (Pisahkan dengan koma)</label>
                                <textarea id="f-counters" class="w-full p-3 border-2 rounded-xl font-bold" rows="2">${config.counters.join(', ')}</textarea>
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-400 mb-1">HEADER CETAKAN RESI</label>
                                <textarea id="f-cheader" class="w-full p-2 border-2 rounded-xl text-sm" rows="2">${config.receiptTemplate.header}</textarea>
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-400 mb-1">FOOTER CETAKAN RESI</label>
                                <textarea id="f-cfooter" class="w-full p-2 border-2 rounded-xl text-sm" rows="2">${config.receiptTemplate.footer}</textarea>
                            </div>

                            <button onclick="saveAdminConfig()" class="mt-auto bg-primary text-white py-4 font-black rounded-xl shadow-lg hover:bg-blue-800 transition">SIMPAN KONFIGURASI</button>
                        </div>

                        <!-- Panel SLA Kanan -->
                        <div class="col-span-7 bg-white p-8 rounded-[2rem] shadow-xl border-t-[12px] border-secondary flex flex-col">
                            <h2 class="font-black text-xl mb-6 border-b pb-2">MONITORING SLA & NASABAH HARI INI</h2>
                            <div class="grid grid-cols-3 gap-4 mb-8">
                                <div class="bg-slate-50 p-6 rounded-2xl border-2 border-slate-100 flex flex-col items-center">
                                    <div class="text-slate-400 text-sm font-bold">TOTAL ANTRIAN</div>
                                    <div id="r-total" class="text-5xl font-black text-slate-800 mt-2">0</div>
                                </div>
                                <div class="bg-primary/10 p-6 rounded-2xl border-2 border-primary/20 flex flex-col items-center">
                                    <div class="text-primary text-sm font-bold">DILAYANI TELLER</div>
                                    <div id="r-teller" class="text-5xl font-black text-primary mt-2">0</div>
                                </div>
                                <div class="bg-secondary/10 p-6 rounded-2xl border-2 border-secondary/20 flex flex-col items-center">
                                    <div class="text-secondary text-sm font-bold">DILAYANI CS</div>
                                    <div id="r-cs" class="text-5xl font-black text-secondary mt-2">0</div>
                                </div>
                            </div>
                            <div class="flex-grow overflow-auto border-2 rounded-xl">
                                <table class="w-full text-left text-sm">
                                    <thead class="sticky top-0 bg-slate-100 text-slate-500 font-black">
                                        <tr>
                                            <th class="p-4 border-b">JAM</th>
                                            <th class="p-4 border-b">TIKET</th>
                                            <th class="p-4 border-b">KEPERLUAN</th>
                                            <th class="p-4 border-b text-center">FOTO</th>
                                        </tr>
                                    </thead>
                                    <tbody id="r-table-body" class="font-semibold text-slate-700"></tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            loadAdminReports();
        }

        async function saveAdminConfig() {
            const newConfig = {
                bankName: config.bankName, primaryColor: config.primaryColor, secondaryColor: config.secondaryColor,
                runningText: document.getElementById('f-text').value,
                videoType: document.getElementById('f-vtype').value,
                videoSource: document.getElementById('f-vsource').value,
                counters: document.getElementById('f-counters').value.split(',').map(s => s.trim()),
                receiptTemplate: {
                    header: document.getElementById('f-cheader').value,
                    footer: document.getElementById('f-cfooter').value
                }
            };
            const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'updateConfig', config: newConfig }) });
            if(res.ok) { alert("Sistem Diperbarui!"); location.reload(); }
        }

        async function loadAdminReports() {
            const res = await fetch(`${API_URL}?action=getReports`);
            const logs = await res.json();
            const tbody = document.getElementById('r-table-body');
            document.getElementById('r-total').innerText = logs.length;
            
            let tCount = 0, cCount = 0;
            logs.reverse().forEach(row => {
                if(row[2] === 'teller') tCount++; else cCount++;
                const tr = document.createElement('tr');
                tr.className = "border-b hover:bg-slate-50";
                tr.innerHTML = `
                    <td class="p-4">${new Date(row[0]).toLocaleTimeString()}</td>
                    <td class="p-4 font-black text-primary text-lg">${row[1]}</td>
                    <td class="p-4">${row[6] || 'Umum'}</td>
                    <td class="p-4 text-center"><img src="${row[5]}" class="h-12 w-12 rounded-lg object-cover inline-block shadow"></td>
                `;
                tbody.appendChild(tr);
            });
            document.getElementById('r-teller').innerText = tCount;
            document.getElementById('r-cs').innerText = cCount;
        }

        init();
    </script>
</body>
</html>
